  function homeTiles(d) {
    return d.curtains.map((m, i) => ({
      ch: i, name: label(d, i), icon: 'dev-curtains', accent: 'var(--primary)',
      on: d.online && phys(d, cur(d, m)) > 2, status: stateText(d, m), controllable: has(d, 'openClose'), offline: !d.online,
    }));
  }
  /** Tile power: stop if moving, else open a closed curtain / close an open one. */
  function toggle(d, i) {
    const m = d.curtains[i];
    if (m.move) return cmd(d, i, 'stop');
    cmd(d, i, phys(d, m.q) > 50 !== flip(d) ? 'close' : 'open');
  }

  /* ==========================================================================
     Curtain scene — sheer fabric on a dark page (SVG, redrawn every frame).
     No cartoon window: a slim ceiling track and white sheer cloth that lets light through.
     Pleats have a soft cosine light profile; the same number of pleats get narrower and deeper as
     the curtain gathers. A weighted hem, a soft shadow on the wall, faint cool light from behind
     when it opens. The hem trails a moving edge and swings back when it stops (spring).
     Coordinates are in a 400 × 300 viewBox.
     ========================================================================== */
  const VB = { w: 400, h: 300 }, ROD = { x0: 22, x1: 378, y: 22 }, FAB = { y0: 21, y1: 284 };
  const SPAN = ROD.x1 - ROD.x0, MINW = 30, ROLL = { x0: 40, x1: 360, y0: 34, min: 6, max: 246 };
  const mixC = (a, b, t) => '#' + [0, 2, 4].map((i) => Math.round(parseInt(a.substr(i + 1, 2), 16) * (1 - t) + parseInt(b.substr(i + 1, 2), 16) * t).toString(16).padStart(2, '0')).join('');
  /** Panel widths (viewBox px) for a physical position p: 0 closed … 100 open. */
  function widths(st, p) {
    const k = 1 - p / 100;
    if (st === 'center') { const w = MINW / 2 + (SPAN / 2 - MINW / 2) * k; return { l: w, r: w }; }
    const w = MINW + (SPAN - MINW) * k;
    return st === 'right' ? { l: 0, r: w } : { l: w, r: 0 };
  }
  const rollH = (p) => ROLL.min + (ROLL.max - ROLL.min) * (1 - p / 100);
  /** Where the leading edge is (for the drag bubble), in viewBox units. */
  function edgePoint(st, p) {
    if (st === 'roller') return { x: 200, y: ROLL.y0 + rollH(p) };
    const w = widths(st, p);
    return st === 'right' ? { x: ROD.x1 - w.r, y: 140 } : st === 'center' ? { x: 200, y: 140 } : { x: ROD.x0 + w.l, y: 140 };
  }
  /** Cosine light profile across one pleat: valley → crest → valley. depth 0…1 */
  function pleatStops(depth, crest) {
    const lo = mixC('#e2e5ea', '#adb3bc', depth), hi = crest;
    return [0, 0.12, 0.25, 0.37, 0.5, 0.63, 0.75, 0.88, 1].map((x) => {
      const t = 0.5 - 0.5 * Math.cos(2 * Math.PI * x);           // 0 at the valleys, 1 at the crest
      return `<stop offset="${x}" stop-color="${mixC(lo, hi, Math.pow(t, 0.8))}"/>`;
    }).join('');
  }

  /* ---------- Cloth motion ----------
     Smooth by construction: every moving part is a critically damped spring (it reaches its target as
     fast as possible and never overshoots — no bounce, no jitter).
     - rail: the leading glider follows the motor / finger; the others follow in proportion, the ones
       near the leading edge faster (the pull travels along the rail like an accordion);
     - cloth: each row of every pleat follows the row above it, lower rows more slowly — the hem trails a
       pull and the lag rolls down the fabric as a soft wave;
     - flutter: soft ripples run through the pleats while the curtain moves and fade out; a barely
       visible "breathing" stays so the fabric never looks frozen;
     - grab: the piece of cloth under the finger and its neighbourhood follow the finger with a soft
       falloff, so the fabric bends where you hold it.
     Shading of every pleat comes from how much that pleat is really compressed. */
  const ROWS = 10, LEN = (FAB.y1 - FAB.y0) / ROWS;
  // real fabric never hangs perfectly even: fixed, slightly different pleat widths (no flicker)
  const PW = [1.08, 0.9, 1.12, 0.96, 0.88, 1.05, 1.1, 0.94, 1.0, 0.9, 1.07, 0.97, 1.03, 0.92, 1.1, 0.95];
  const DV = [0.14, -0.1, 0.2, -0.12, 0.04, -0.16, 0.1, 0, -0.06, 0.16, -0.12, 0.08];   // per-pleat depth
  const BX = [0, 0.6, -0.5, 0.7, -0.7, 0.3, -0.3, 0.6, -0.6, 0.4, -0.4, 0.2, -0.3];     // how each pleat leans when it hangs (sums to 0)
  const cum = (n) => { const out = [0]; for (let k = 0; k < n; k++) out.push(out[k] + PW[k % PW.length]); return out.map((v) => v / out[n]); };
  // Feel (all in one place): spring speeds (rad/s), how much slower the hem is, flutter, breathing
  const FEEL = { lead: 26, rail: 12, row: 22, rowFall: 0.6, flutterAmp: 7, flutterHz: 1.25, flutterFade: 1.3, breathe: 0, grabReach: 1.8, railDrag: 7 };   // breathe 0: still when nothing moves; railDrag: how slowly the rod end follows your hand
  /** one step of a critically damped spring (semi-implicit, stable at 120 Hz) */
  const spring = (o, target, w, dt) => { o.v += (w * w * (target - o.x) - 2 * w * o.v) * dt; o.x += o.v * dt; };

  function clothPanel(x0, dir, n, full, minW, w) {
    const f = cum(n), P = { x0, dir, n, rest: full / n * 1.12, smin: Math.max(1.2, minW / n), f, g: [], gs: [], ch: [], e: 0, t: 0 };
    for (let k = 0; k <= n; k++) {
      const x = x0 + dir * w * f[k];
      P.gs.push({ x, v: 0 }); P.g.push(x);
      P.ch.push(Array.from({ length: ROWS + 1 }, (_, j) => ({ s: { x: x + dir * BX[k % BX.length] * 2.2 * (j / ROWS), v: 0 }, x, y: FAB.y0 + j * LEN })));
    }
    return P;
  }
  function clothFor(st, p) {
    const w = widths(st, p);
    if (st === 'center') return { st, panels: [clothPanel(ROD.x0, 1, 7, SPAN / 2, MINW / 2, w.l), clothPanel(ROD.x1, -1, 7, SPAN / 2, MINW / 2, w.r)] };
    return { st, panels: [st === 'right' ? clothPanel(ROD.x1, -1, 12, SPAN, MINW, w.r) : clothPanel(ROD.x0, 1, 12, SPAN, MINW, w.l)] };
  }
  /** grab: { k, j, x } — a piece of this panel held under the finger (or null) */
  function stepPanel(P, w, dt, grab) {
    const { x0, dir, n, f, gs } = P, lead = x0 + dir * w;
    // rail
    gs[0].x = x0; gs[0].v = 0;
    // your hand leads; the gliders on the rod are dragged along behind it (slower spring while you hold the cloth)
    spring(gs[n], lead, grab ? FEEL.railDrag : FEEL.lead, dt);
    const span = (gs[n].x - x0) * dir;
    for (let k = 1; k < n; k++) spring(gs[k], x0 + dir * span * f[k], FEEL.rail * (0.55 + 0.45 * k / n), dt);
    for (let k = 1; k <= n; k++) if ((gs[k].x - gs[k - 1].x) * dir < P.smin) gs[k].x = gs[k - 1].x + dir * P.smin;   // gliders never pass each other
    gs.forEach((o, k) => { P.g[k] = o.x; });
    // flutter energy: follows the leading edge's speed, then fades
    P.e = Math.max(P.e * Math.exp(-FEEL.flutterFade * dt), Math.min(1, Math.abs(gs[n].v) / 240));
    P.t += dt;
    // cloth rows
    const kg = grab ? grab.k : -1, jg = grab ? grab.j : -1;
    const pull = grab ? grab.x - P.ch[kg][0].s.x : 0;                     // how far the hand pulls that pleat from its glider
    for (let k = 0; k <= n; k++) {
      const c = P.ch[k];
      c[0].s.x = gs[k].x; c[0].s.v = gs[k].v;
      const wk = grab ? Math.exp(-((k - kg) ** 2) / (2 * FEEL.grabReach ** 2)) : 0;
      for (let j = 1; j <= ROWS; j++) {
        const lean = dir * BX[k % BX.length] * 2.2 * (j / ROWS);
        let target = c[j - 1].s.x + dir * BX[k % BX.length] * 2.2 / ROWS;   // follow the row above (+ its natural lean, mirrored per side)
        if (grab) {                                                       // the hand: strongest at the grabbed row, fading up and down
          const wr = j <= jg ? j / jg : Math.max(0, 1 - (j - jg) / (ROWS - jg + 2));
          target = target * (1 - wk * wr) + (gs[k].x + lean + pull * 1) * wk * wr;
        }
        spring(c[j].s, target, FEEL.row * (1 - FEEL.rowFall * j / ROWS), dt);
      }
    }
    // order per row (a crossed pleat looks like a tear) + stay between the walls
    for (let j = 1; j <= ROWS; j++) {
      for (let k = 1; k <= n; k++) {
        const a = P.ch[k - 1][j].s, b = P.ch[k][j].s;
        if ((b.x - a.x) * dir < 0.5) b.x = a.x + dir * 0.5;
      }
      for (let k = 0; k <= n; k++) { const q = P.ch[k][j].s; q.x = Math.max(ROD.x0 - 4, Math.min(ROD.x1 + 4, q.x)); }
    }
    // what is drawn: spring position + flutter ripple; the cloth keeps its length (the hem lifts a little when it swings)
    const amp = FEEL.flutterAmp * P.e + FEEL.breathe;
    for (let k = 0; k <= n; k++) {
      const c = P.ch[k];
      c[0].x = c[0].s.x; c[0].y = FAB.y0;
      for (let j = 1; j <= ROWS; j++) {
        const depth = Math.pow(j / ROWS, 1.4);
        const ripple = dir * amp * depth * Math.sin(2 * Math.PI * FEEL.flutterHz * P.t - j * 0.62 - k * 1.05);
        c[j].x = c[j].s.x + ripple;
        const dx = c[j].x - c[j - 1].x;
        c[j].y = c[j - 1].y + Math.sqrt(Math.max(LEN * LEN * 0.35, LEN * LEN - dx * dx));
      }
    }
  }
  function stepCloth(C, st, p, dt, grab) {
    const w = widths(st, p), ws = st === 'center' ? [w.l, w.r] : [st === 'right' ? w.r : w.l];
    const sub = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / sub;
    // opens from the middle: whatever the hand does to one half happens mirrored to the other half
    const mirror = grab && C.panels.length === 2 ? { pi: 1 - grab.pi, k: grab.k, j: grab.j, x: ROD.x0 + ROD.x1 - grab.x } : null;
    for (let s = 0; s < sub; s++) C.panels.forEach((P, i) => stepPanel(P, ws[i], h, grab && grab.pi === i ? grab : mirror && mirror.pi === i ? mirror : null));
  }

  /** Smooth path through points (quadratic through midpoints). */
  function smooth(pts, move = true) {
    let d = (move ? 'M ' : 'L ') + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
    for (let i = 1; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      d += ` Q ${a.x.toFixed(1)} ${a.y.toFixed(1)} ${((a.x + b.x) / 2).toFixed(1)} ${((a.y + b.y) / 2).toFixed(1)}`;
    }
    const z = pts[pts.length - 1];
    return d + ` L ${z.x.toFixed(1)} ${z.y.toFixed(1)}`;
  }
  const LEVELS = 7;
  function renderPanel(u, idx, P) {
    const { dir, n, rest } = P, id = `${u}p${idx}`;
    let defs = '', strips = '';
    for (let l = 0; l < LEVELS; l++) {
      const depth = 0.1 + (l / (LEVELS - 1)) * 0.7;
      const x1 = dir > 0 ? 0 : 1, x2 = 1 - x1;
      defs += `<linearGradient id="${id}a${l}" x1="${x1}" x2="${x2}">${pleatStops(depth, '#fbfcfd')}</linearGradient><linearGradient id="${id}b${l}" x1="${x1}" x2="${x2}">${pleatStops(Math.min(1, depth + 0.06), '#eff1f4')}</linearGradient><linearGradient id="${id}c${l}" x1="${x1}" x2="${x2}">${pleatStops(Math.max(0, depth - 0.05), '#f6f7f9')}</linearGradient>`;
    }
    for (let k = 0; k < n; k++) {
      const L = P.ch[k], R = P.ch[k + 1];
      let s = 0; for (let j = 0; j <= ROWS; j++) s += Math.abs(R[j].x - L[j].x);
      const comp = 1 - Math.min(1, s / (ROWS + 1) / (rest / 1.12));          // 0 flat … 1 bunched
      const lvl = Math.max(0, Math.min(LEVELS - 1, Math.round((comp * 0.85 + 0.1 + DV[k % DV.length]) * (LEVELS - 1))));
      const lb = L[ROWS], rb = R[ROWS], sag = 1 + 4 * comp + (k % 3) * 0.7;
      const d = smooth(L) + ` Q ${((lb.x + rb.x) / 2).toFixed(1)} ${(Math.max(lb.y, rb.y) + sag * 1.8).toFixed(1)} ${rb.x.toFixed(1)} ${rb.y.toFixed(1)} ` + smooth([...R].reverse(), false) + ' Z';
      const v = 'abcbacab'[k % 8];
      strips += `<path d="${d}" fill="url(#${id}${v}${lvl})" stroke="url(#${id}${v}${lvl})" stroke-width=".4"/>`;
    }
    const first = P.ch[0], last = P.ch[n];
    const outline = smooth(first) + ' ' + P.ch.map((c) => `L ${c[ROWS].x.toFixed(1)} ${(c[ROWS].y + 3).toFixed(1)}`).join(' ') + ' ' + smooth([...last].reverse(), false) + ' Z';
    return `<defs>${defs}<clipPath id="${id}k"><path d="${outline}"/></clipPath></defs>
      <path d="${outline}" fill="#000" opacity=".07" transform="translate(${dir * 4} 7)"/><path d="${outline}" fill="#000" opacity=".09" transform="translate(${dir * 2} 4)"/>
      <g opacity=".8" filter="url(#${u}cloth)">${strips}</g>
      <g clip-path="url(#${id}k)">
        <rect x="${WIN.x0 + 14}" y="${WIN.y0 + 12}" width="${WIN.x1 - WIN.x0 - 28}" height="${WIN.y1 - WIN.y0 - 24}" rx="20" fill="url(#${u}back)"/>
        <rect width="${VB.w}" height="${VB.h}" fill="url(#${u}weave)"/>
        <rect width="${VB.w}" height="${VB.h}" fill="url(#cw-noise)" opacity=".5"/>
        <rect width="${VB.w}" height="${VB.h}" fill="url(#${u}sheen)"/><rect y="${FAB.y1 - 18}" width="${VB.w}" height="30" fill="url(#${u}hem)"/>
      </g>`;
  }

  /* Window behind the curtain: a real frame with depth (outer frame, two sashes, centre post with a
     handle, a sill), clear glass lit softly from outside with a couple of reflections. Kept quiet so the
     fabric stays the hero, but it reads as a window at a glance. */
  const WIN = { x0: 74, x1: 326, y0: 44, y1: 262 };
  function windowSVG(u, open) {
    const { x0, x1, y0, y1 } = WIN, F = 7, M = 6, mx = (x0 + x1) / 2;
    const pane = (a, b) => `<rect x="${a}" y="${y0 + F}" width="${b - a}" height="${y1 - y0 - 2 * F}" rx="1.5" fill="url(#${u}glass)"/>
      <rect x="${a}" y="${y0 + F}" width="${b - a}" height="${y1 - y0 - 2 * F}" rx="1.5" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1.2"/>
      <rect x="${a + 0.8}" y="${y0 + F + 0.8}" width="${b - a - 1.6}" height="1" fill="#fff" opacity=".08"/>`;
    const l0 = x0 + F, l1 = mx - M / 2, r0 = mx + M / 2, r1 = x1 - F;
    return `<defs>
        <linearGradient id="${u}glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fbde6" stop-opacity="${(0.2 + open * 0.08).toFixed(3)}"/><stop offset=".6" stop-color="#6f8db8" stop-opacity=".12"/><stop offset="1" stop-color="#4c6488" stop-opacity=".1"/></linearGradient>
        <linearGradient id="${u}frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b424c"/><stop offset="1" stop-color="#2a3038"/></linearGradient>
        <linearGradient id="${u}refl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <clipPath id="${u}wc"><rect x="${l0}" y="${y0 + F}" width="${r1 - l0}" height="${y1 - y0 - 2 * F}"/></clipPath>
      </defs>
      <g opacity=".42">
      <rect x="${x0 - 3}" y="${y0 - 3}" width="${x1 - x0 + 6}" height="${y1 - y0 + 6}" rx="4" fill="#000" opacity=".25" filter="url(#${u}soft)"/>
      <rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="3" fill="url(#${u}frame)"/>
      <rect x="${x0 + 0.5}" y="${y0 + 0.5}" width="${x1 - x0 - 1}" height="${y1 - y0 - 1}" rx="3" fill="none" stroke="#fff" stroke-opacity=".1"/>
      ${pane(l0, l1)}${pane(r0, r1)}
      <g clip-path="url(#${u}wc)"><path d="M ${l0 + 18} ${y1} L ${l0 + 86} ${y0} L ${l0 + 112} ${y0} L ${l0 + 44} ${y1} Z" fill="url(#${u}refl)"/><path d="M ${r0 + 40} ${y1} L ${r0 + 92} ${y0} L ${r0 + 102} ${y0} L ${r0 + 50} ${y1} Z" fill="url(#${u}refl)"/></g>
      <rect x="${mx - 1.5}" y="${(y0 + y1) / 2 - 9}" width="3" height="18" rx="1.5" fill="#8b939e"/>
      <rect x="${x0 - 10}" y="${y1}" width="${x1 - x0 + 20}" height="5" rx="1.5" fill="#3d444e"/>
      <rect x="${x0 - 10}" y="${y1}" width="${x1 - x0 + 20}" height="1" fill="#fff" opacity=".12"/>
      <rect x="${x0 - 10}" y="${y1 + 5}" width="${x1 - x0 + 20}" height="4" fill="#000" opacity=".3" filter="url(#${u}soft)"/>
      </g>`;
  }
  /* Fabric grain: a small random texture made once and put in a hidden <svg> on the page;
     every scene refers to it (url(#cw-noise)), so the per-frame SVG stays small. */
  function ensureNoise() {
    if (document.getElementById('cw-noise')) return;
    let url = '';
    try {
      const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'), im = x.createImageData(64, 64);
      for (let i = 0; i < im.data.length; i += 4) { const v = 120 + Math.random() * 135; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 22 + Math.random() * 26; }
      x.putImageData(im, 0, 0); url = c.toDataURL();
    } catch (e) { return; }
    const holder = document.createElement('div');
    holder.innerHTML = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="cw-noise" patternUnits="userSpaceOnUse" width="64" height="64"><image href="${url}" width="64" height="64"/></pattern></defs></svg>`;
    document.body.appendChild(holder.firstChild);
  }
  /* Slim round rod: graphite metal with a soft cylindrical highlight, end caps, two wall brackets */
  function rodSVG(u) {
    const xa = ROD.x0 - 12, xb = ROD.x1 + 12, y = ROD.y;
    const bracket = (x) => `<rect x="${x - 1}" y="${y - 10}" width="2" height="9" rx="1" fill="#3a3f46"/><rect x="${x - 3.5}" y="${y - 11.5}" width="7" height="2.4" rx="1.2" fill="#2a2e34"/>`;
    return `<rect x="${xa}" y="${y + 3}" width="${xb - xa}" height="4" rx="2" fill="#000" opacity=".35" filter="url(#${u}soft)"/>
      ${bracket(ROD.x0 + 10)}${bracket(ROD.x1 - 10)}
      <rect x="${xa}" y="${y - 2.6}" width="${xb - xa}" height="5.2" rx="2.6" fill="url(#${u}rodv)"/>
      <rect x="${xa + 3}" y="${y - 1.7}" width="${xb - xa - 6}" height=".7" rx=".35" fill="#fff" opacity=".35"/>
      <rect x="${xa - 5}" y="${y - 3.6}" width="6" height="7.2" rx="2.2" fill="url(#${u}rodv)"/><rect x="${xb - 1}" y="${y - 3.6}" width="6" height="7.2" rx="2.2" fill="url(#${u}rodv)"/>`;
  }
  /** Whole scene. o: { cloth (live simulation), sway (roller bar), mini, uid } */
  function scene(st, p, o = {}) {
    ensureNoise();
    const u = o.uid || 'cs', open = p / 100, sw = o.sway || { l: 0, r: 0 };
    let body = '';
    if (st === 'roller') {
      const h = rollH(p), yb = ROLL.y0 + h, s = sw.l;
      body = `<defs>
          <linearGradient id="${u}rf" x1="0" x2="1"><stop offset="0" stop-color="#d9dde3"/><stop offset=".12" stop-color="#f3f5f7"/><stop offset=".5" stop-color="#fbfcfd"/><stop offset=".88" stop-color="#f3f5f7"/><stop offset="1" stop-color="#d9dde3"/></linearGradient>
          <pattern id="${u}rw" patternUnits="userSpaceOnUse" width="4" height="4"><path d="M0 3.5H4" stroke="#5c636d" stroke-opacity=".08" stroke-width=".7"/></pattern>
          <clipPath id="${u}rc"><rect x="${ROLL.x0}" y="${ROLL.y0}" width="${ROLL.x1 - ROLL.x0}" height="${h.toFixed(1)}"/></clipPath>
        </defs>
        <rect x="${ROLL.x0 + 4}" y="${ROLL.y0 + 8}" width="${ROLL.x1 - ROLL.x0 - 8}" height="${h.toFixed(1)}" fill="#000" opacity=".45" filter="url(#${u}soft)"/>
        <rect x="${ROLL.x0}" y="${ROLL.y0}" width="${ROLL.x1 - ROLL.x0}" height="${h.toFixed(1)}" fill="url(#${u}rf)" opacity=".86"/>
        <g clip-path="url(#${u}rc)"><rect width="${VB.w}" height="${VB.h}" fill="url(#${u}rw)"/><rect width="${VB.w}" height="${VB.h}" fill="url(#${u}sheen)"/></g>
        <g transform="rotate(${(s * 0.1).toFixed(2)} 200 ${yb.toFixed(1)})">
          <rect x="${ROLL.x0 - 3}" y="${(yb - 3).toFixed(1)}" width="${ROLL.x1 - ROLL.x0 + 6}" height="5" rx="2.5" fill="url(#${u}rodv)"/></g>
        <rect x="${ROLL.x0 - 8}" y="${ROLL.y0 - 4}" width="${ROLL.x1 - ROLL.x0 + 16}" height="5" fill="#000" opacity=".4" filter="url(#${u}soft)"/>
        <rect x="${ROLL.x0 - 8}" y="${ROLL.y0 - 15}" width="${ROLL.x1 - ROLL.x0 + 16}" height="15" rx="7.5" fill="url(#${u}rodv)"/>
        <rect x="${ROLL.x0 - 2}" y="${ROLL.y0 - 12}" width="${ROLL.x1 - ROLL.x0 + 4}" height="1" rx=".5" fill="#fff" opacity=".3"/>
        <rect x="${ROLL.x0 - 11}" y="${ROLL.y0 - 16}" width="8" height="17" rx="3" fill="#2a2e34"/><rect x="${ROLL.x1 + 3}" y="${ROLL.y0 - 16}" width="8" height="17" rx="3" fill="#2a2e34"/>`;
    } else {
      const C = o.cloth && o.cloth.st === st ? o.cloth : clothFor(st, p);   // thumbnails: cloth at rest
      C.panels.forEach((P, i) => { body += renderPanel(u, i, P); });

      'ct-setup': () => openWizard(d, ctx, d.sel || 0, 'style'),
    });
    UI.screen.addEventListener('input', (e) => { if (e.target.id === 'tiltR') { d.settings.tilt = +e.target.value; UI.setNum(UI.screen.querySelector('#tiltVal'), e.target.value + ' %'); } });
    UI.screen.addEventListener('change', (e) => { if (e.target.id === 'tiltR') commit(); });
    bindDrag(d, ctx);
    startLoop(d, ctx);
  }
  function startLoop(d, ctx) {
    if (loopOn) return; loopOn = true; lastKey = stateKey(d);
    const run = () => { frame(d, ctx); requestAnimationFrame(run); };
    requestAnimationFrame(run);
  }

  /* ==========================================================================
     Setup wizard (sheet): opening style → direction test → calibration → 50 % test
     ========================================================================== */
  const STEPS = ['style', 'dir', 'cal', 'test', 'done'];
  function wizLine(d, m) {
    let t = m.move ? movingText(d, m) : m.fault ? 'Blocked' : 'Stopped';
    if (d.cal === 'auto' && !m.calibrated && (m.hit0 || m.hit100 || m.move)) t += ` · ends found: ${(m.hit0 ? 1 : 0) + (m.hit100 ? 1 : 0)} of 2`;
    if (m.timing !== null) t += ` · timing ${((Date.now() - m.timing) / 1000).toFixed(1)} s`;
    if (m.calibrated) t += ` · ${shown(d, cur(d, m))} %`;
    return t;
  }
  function openWizard(d, ctx, i, from) {
    const w = { step: from, sub: 0, ask: null, auto: null };
    const m = () => d.curtains[i];
    const save = () => { Store.save(); ctx.render(); };
    const dots = () => `<div class="wz-dots" aria-label="Step ${STEPS.indexOf(w.step) + 1} of 4">${STEPS.slice(0, 4).map((x, j) => `<i class="${j <= STEPS.indexOf(w.step) ? 'on' : ''}"></i>`).join('')}</div>`;
    const liveLine = () => `<div class="wz-live" data-num data-cl="wz">${esc(wizLine(d, m()))}</div>`;
    const btn = (a, l, cls = 'btn-secondary', extra = '') => `<button class="btn ${cls} grow" data-action="wz" data-a="${a}" ${extra}>${l}</button>`;
    const TITLE = { style: 'How does it open?', dir: 'Check the direction', cal: 'Calibrate', test: 'Test', done: 'Curtain ready' };
    const SUB = {
      style: 'This only changes the picture in the app.',
      dir: `Tap <b>Open</b> and watch the real ${roller(d) ? 'blind' : 'curtain'}.`,
      cal: () => esc(CAL[d.cal].text),
      test: 'Tap Go to 50 %. It should stop about halfway — if it does, tap Looks right.',
      done: 'Opening style, direction and calibration are saved.',
    };
    function body() {
      const mm = m();
      if (w.step === 'style') return `<div class="cw-styles">${F.openingStyle.opts.map(([k, t]) => `<button class="cw-style" data-action="wz-style" data-v="${k}" aria-pressed="${style(d) === k}">${styleThumb(k)}<span>${t}</span></button>`).join('')}</div>`;
      if (w.step === 'dir') {
        return liveLine() + `<div class="wz-row">${btn('open', `${glyph(openGlyph(d), 'cg sm')} Open`, 'btn-primary')}${btn('stop', `${glyph('stop', 'cg sm')} Stop`)}</div>`
          + (w.ask === 'ask' ? `<div class="wz-q"><b>Did it ${roller(d) ? 'go up' : 'open'}?</b><div class="wz-row">${btn('yes', 'Yes')}${btn('no', roller(d) ? 'No, it went down' : 'No, it closed')}</div></div>` : '')
          + (w.ask === 'fixed' ? `<div class="banner info" style="margin-top:12px">${icon('check')}<div><b>Motor direction switched</b> · Tap Open again to check.</div></div>` : '');
      }
      if (w.step === 'cal') {
        if (mm.calibrated) return liveLine() + `<div class="banner info">${icon('check')}<div><b>Calibrated</b> · ${mm.ctime ? `Full run: ${mm.ctime.toFixed(1)} s.` : 'Both ends are saved.'}</div></div>`;
        const c = d.cal;
        if (c === 'auto' || c === 'autoCmd') {
          return liveLine() + `<ol class="wz-list"><li>Make sure nothing blocks the ${roller(d) ? 'blind' : 'track'}.</li><li>${c === 'auto' ? 'It closes until it finds the end, then opens to the other end.' : 'The device runs to both ends by itself.'}</li></ol>`;
        }
        if (c === 'time') {
          return liveLine() + `<ol class="wz-list">
            <li class="${w.sub > 0 ? 'done' : ''}"><b>Open fully</b>, then Stop.${w.sub === 0 ? `<div class="wz-row">${btn('open', 'Open')}${btn('stop', 'Stop')}</div>` : ''}</li>
            <li class="${w.sub !== 1 ? 'wait' : ''}"><b>Start timing</b> — it closes. Tap Stop exactly when it is fully closed.${w.sub === 1 ? `<div class="wz-row">${mm.timing === null ? btn('tStart', 'Start timing', 'btn-primary') : btn('tStop', 'Stop — it’s closed', 'btn-primary')}</div>` : ''}</li></ol>
            <p class="wz-hint">Stopping early or late makes every position wrong.</p>`;
        }
        return liveLine() + `<div class="wz-row">${btn('up', glyph('up', 'cg sm'), 'btn-secondary', 'aria-label="Up"')}${btn('stop', glyph('stop', 'cg sm'), 'btn-secondary', 'aria-label="Stop"')}${btn('down', glyph('down', 'cg sm'), 'btn-secondary', 'aria-label="Down"')}</div>
          <div style="margin-top:16px">${UI.group('', `
            <button class="cell" data-action="wz" data-a="saveOpen"><span class="cell-main cell-title">Save as fully open</span>${mm.limOpen ? `<span class="cw-ok">${icon('check')}</span>` : ''}</button>
            <button class="cell" data-action="wz" data-a="saveClose"><span class="cell-main cell-title">Save as fully closed</span>${mm.limClose ? `<span class="cw-ok">${icon('check')}</span>` : ''}</button>`)}</div>
          <p class="wz-hint">Without saved ends a roller blind can roll too far and damage the fabric.</p>`;
      }
      if (w.step === 'test') return liveLine() + `<div class="wz-row">${btn('g50', 'Go to 50 %', 'btn-primary')}</div>`;
      return `<div class="hero" style="padding:4px 0 0"><div class="hero-icon" style="width:72px;height:72px;border-radius:50%;background:var(--green-soft);display:flex;align-items:center;justify-content:center;color:var(--green)">${icon('check', 'icon', 'style="width:36px;height:36px"')}</div></div>`;
    }
    function footer() {
      const mm = m();
      if (w.step === 'style') return btn('next-dir', 'Next', 'btn-primary btn-block');
      if (w.step === 'dir') return btn('skip-dir', 'Skip', 'btn-glass btn-block');
      if (w.step === 'cal') {
        if (mm.calibrated) return has(d, 'position') ? btn('next-test', 'Next: test', 'btn-primary btn-block') : btn('finish', 'Finish', 'btn-primary btn-block');
        if (d.cal === 'auto' || d.cal === 'autoCmd') return btn('autoStart', w.auto ? 'Calibrating…' : d.cal === 'auto' ? 'Start' : 'Calibrate', 'btn-primary btn-block', w.auto ? 'disabled' : '');
        if (d.cal === 'time' && w.sub === 0) return btn('s1', 'It’s fully open — next', 'btn-primary btn-block');
        return '';
      }
      if (w.step === 'test') return `<div class="wz-row" style="margin:0">${btn('again', 'Recalibrate')}${btn('finish', 'Looks right', 'btn-primary')}</div>`;
      return '<button class="btn btn-primary btn-block" data-action="sheet-close">Done</button>';
    }
    const draw = () => UI.sheet({
      title: TITLE[w.step], sub: (typeof SUB[w.step] === 'function' ? SUB[w.step]() : SUB[w.step]),
      tabs: () => dots(), render: body, footer,
      onClose: () => { hooks.delete(onState); },
    });
    let s = draw();
    // Motor state changed (stopped, end found, calibrated…): redraw, and drive the auto-learn run
    const onState = () => {
      const mm = m();
      if (w.auto === 'closing' && !mm.move) { w.auto = 'opening'; cmd(d, i, 'open'); Store.save(); }
      else if (w.auto === 'opening' && !mm.move) {
        w.auto = null;
        if (!mm.calibrated) { mm.calibrated = true; mm.ctime = 100 / rate(d); }   // one-tap auto reports “fully calibrated”
        save();
      }
      if (w.step === 'dir' && w.ask === 'moving' && !mm.move) w.ask = 'ask';
      s.refresh();
    };
    hooks.add(onState);
    const go = (step) => { w.step = step; w.sub = 0; w.ask = null; s = draw(); };
    UI.on({
      'wz-style': ({ v }) => { d.settings.openingStyle = v; save(); s.refresh(); },
      wz: ({ a }) => {
        const mm = m();
        if (a === 'next-dir') return go('dir');
        if (a === 'skip-dir' || a === 'yes') return go('cal');
        if (a === 'no') { d.settings.reverse = !d.settings.reverse; resetLimits(mm); w.ask = 'fixed'; save(); return s.refresh(); }
        if (a === 'open' && w.step === 'dir') { begin(d, mm, 1, clamp(Math.round(mm.q) + 35)); w.ask = 'moving'; save(); return s.refresh(); }
        if (a === 'open' || a === 'up') cmd(d, i, 'open');
        else if (a === 'down') cmd(d, i, 'close');
        else if (a === 'stop') cmd(d, i, 'stop');
        else if (a === 'autoStart') { resetLimits(mm); w.auto = 'closing'; begin(d, mm, -1, null); }
        else if (a === 's1') { stop(d, mm); w.sub = 1; }
        else if (a === 'tStart') { mm.timing = Date.now(); begin(d, mm, -1, null); }
        else if (a === 'tStop') stop(d, mm);
        else if (a === 'saveOpen') { stop(d, mm); mm.limOpen = true; mm.q = 100; }
        else if (a === 'saveClose') { stop(d, mm); mm.limClose = true; mm.q = 0; }
        else if (a === 'next-test') return go('test');
        else if (a === 'g50') goTo(d, i, 50);
        else if (a === 'again') { resetLimits(mm); save(); return go('cal'); }
        else if (a === 'finish') { save(); return go('done'); }
        if (mm.limOpen && mm.limClose && d.cal === 'limits') mm.calibrated = true;
        save(); s.refresh();
      },
    });
  }

  /* ==========================================================================
     Settings page sections (device-settings.html)
     ========================================================================== */
  function summary(d, k) {
    const f = F[k], m = d.curtains[0];
    if (f.type === 'choice' || f.type === 'style') return { value: f.opts.find((o) => o[0] === S(d, k))[1] };
    if (k === 'reverse') return { value: S(d, k) ? 'Reversed' : 'Normal' };
    if (f.type === 'toggle') return { value: S(d, k) ? 'On' : 'Off' };
    if (k === 'calibration') {
      const done = d.curtains.filter((c) => c.calibrated).length;
      return { sub: CAL[d.cal].name, value: done === d.curtains.length ? 'Done' : multi(d) ? `${done} of ${d.curtains.length}` : 'Not done' };
    }
    if (k === 'resetLimits') return { sub: 'Delete the learned ends' };
    return { value: m.calibrated ? 'Done' : '' };
  }
  function settings(d) {
    let h = '';
    if (multi(d)) {
      h += `<div class="list-header">Curtains</div><div class="list">${d.curtains.map((c, i) => `<button class="cell has-icon" data-action="cs-rename" data-ch="${i}"><span class="cell-icon">${icon('dev-curtains')}</span>
        <span class="cell-main"><span class="cell-title" style="display:block">${esc(c.name)}</span><span class="cell-sub" style="display:block">Curtain ${i + 1} · ${c.calibrated ? 'calibrated' : 'not calibrated'}</span></span>${icon('chevron-right', 'chev')}</button>`).join('')}</div>`;
    }
    if (has(d, 'calibration')) {
      h += `<div class="pad" style="margin-top:20px"><button class="cw-setup" data-action="cs-setup"><span class="cw-setup-ic">${icon('ai-stars')}</span>
        <span class="grow"><b>Curtain setup</b><span>Opening style → direction → calibration → test</span></span>${icon('chevron-right', 'chev')}</button></div>`;
    }
    for (const g of SETTINGS_GROUPS) {
      const ks = Object.keys(F).filter((k) => F[k].grp === g && has(d, k));
      if (!ks.length) continue;
      h += `<div class="list-header">${g}</div><div class="list">${ks.map((k) => {
        if (F[k].type === 'toggle') {
          const sub = k === 'reverse' && has(d, 'calibration') ? 'Changing it deletes the learned ends' : F[k].short;
          return `<button class="cell" data-action="cs-toggle" data-k="${k}" role="switch" aria-checked="${!!S(d, k)}">
            <span class="cell-main"><span class="cell-title" style="display:block">${esc(F[k].name)}</span><span class="cell-sub" style="display:block">${esc(sub)}</span></span>
            <span class="switch" aria-hidden="true" aria-checked="${!!S(d, k)}"></span></button>`;
        }
        const sm = summary(d, k), danger = k === 'resetLimits';
        return `<button class="cell" data-action="cs-feature" data-k="${k}">
          <span class="cell-main"><span class="cell-title" style="display:block;${danger ? 'color:var(--red)' : ''}">${esc(F[k].name)}</span>${sm.sub ? `<span class="cell-sub" style="display:block">${esc(sm.sub)}</span>` : ''}</span>
          ${sm.value ? `<span class="cell-value">${esc(sm.value)}</span>` : ''}${danger ? '' : icon('chevron-right', 'chev')}</button>`;
      }).join('')}</div>`;
    }
    return h;
  }
  function openFeature(d, k, ctx) {
    const f = F[k];
    if (k === 'calibration') return openWizard(d, ctx, d.sel || 0, 'cal');
    if (k === 'resetLimits') {
      return UI.confirm({ title: 'Reset limits?', text: 'The learned open and closed ends will be deleted. Positions stop working until you calibrate again.', ok: 'Reset',
        onOk: () => { d.curtains.forEach(resetLimits); Store.save(); ctx.render(); UI.toast('Limits deleted — calibrate again'); } });
    }
    if (f.type === 'direction') return openDirection(d, ctx);
    const commit = () => { Store.save(); ctx.render(); s.refresh(); };
    const s = UI.sheet({
      title: f.name, sub: esc(f.short),
      render: () => {
        const v = S(d, k);

      'cf-opt': ({ v }) => { d.settings[k] = v; commit(); },

  /** Motor direction: two plain choices + Open / Stop / Close to test it right here. */

        ${UI.group('Direction', opt(false, 'Normal', `“Open” ${word[0]} the ${noun(d)}`) + opt(true, 'Reversed', `For a motor installed the other way round — use it if “Open” ${word[1]} the ${noun(d)}`))}

  function bindSettings(d, ctx) {
    UI.on({
      'cs-feature': ({ k }) => openFeature(d, k, ctx),
      'cs-toggle': ({ k }) => {
        d.settings[k] = !S(d, k);

        Store.save(); ctx.render();
      },
      'cs-setup': () => openWizard(d, ctx, d.sel || 0, 'style'),
      'cs-rename': ({ ch }) => UI.prompt({ title: 'Rename curtain', label: 'Curtain name', value: d.curtains[+ch].name, onOk: (v) => { d.curtains[+ch].name = v; Store.save(); ctx.render(); UI.toast('Saved'); } }),
      'rs-identify': () => {
        if (!d.online) return UI.toast('Curtain is offline');

      h += `<div class="cw-readout ct-readout" data-key="readout"><div><div class="ct-word ${tone}" data-cl="word">${d.online ? stateWord(d) : 'Unknown'}</div>
          <div class="cw-state" data-num data-live="since">${d.online ? sinceText(d) : `Last: ${stateWord(d).toLowerCase()}`}</div></div>
          ${has(d, 'history') ? `<span class="cw-hint" data-num data-live="times">${timesText(opensToday(d))}</span>` : ''}</div>`;
    }

    // Readings (flat information cards, Figma info-card; wide ones carry an icon on the right)
    const cards = [];
    if (has(d, 'climate')) {
      cards.push(`<div class="info-card"><span>Temperature</span><b data-num="count">${d.temp.toFixed(1)} °C</b></div>`);
      cards.push(`<div class="info-card"><span>Humidity</span><b data-num="count">${d.hum} %</b></div>`);
    }
    if (has(d, 'light')) cards.push(`<div class="info-card wide"><span>Light level</span><b data-num="count">${d.lux < 30 ? 'Dark' : d.lux < 200 ? 'Twilight' : 'Bright'} · ${d.lux} lx</b>${icon('sun')}</div>`);
    if (has(d, 'battery')) cards.push(`<div class="info-card wide"><span>${battLow(d) ? 'Battery · replace the coin cell' : 'Battery'}</span><b data-num="count">${d.battery} %</b>${icon('battery')}</div>`);
    if (cards.length) h += `<div class="pad info-grid" data-key="info" style="margin-top:24px">${cards.join('')}</div>`;
    return h + '<div style="height:28px"></div>';
  }

  /** Cheap per-second update (no re-render): durations, countdowns. */
  function live(d, root) {
    UI.setNum(root.querySelector('[data-live="since"]'), d.online ? sinceText(d) : `Last: ${stateWord(d).toLowerCase()}`);
    UI.setNum(root.querySelector('[data-live="times"]'), timesText(opensToday(d)));
    const b = root.querySelector('[data-live="break"]'); if (b && breakOn(d)) UI.setNum(b, UI.fmtDur((d.st.breakUntil - Date.now()) / 1000));
    afterRender(d, root);
  }
  /** One-shot animations that follow a report: the LED blinks, the leaf shakes on a knock. */
  const seen = { blink: 0, knock: 0 };
  function afterRender(d, root) {
    const card = root.querySelector('.ct-card'); if (!card) return;
    if (d.blinkAt > seen.blink) { seen.blink = d.blinkAt; if (Date.now() - d.blinkAt < 1500) UI.pulse(card, 'blink'); }
    if (d.knockAt > seen.knock) { seen.knock = d.knockAt; if (Date.now() - d.knockAt < 1500) UI.pulse(card, 'knock'); }
  }
  function bindPage(d) { seen.blink = d.blinkAt; seen.knock = d.knockAt; }   // don't replay old blinks on page load

  /* ==========================================================================
     Settings (device-settings.html)
     ========================================================================== */
  function summary(d, k) {
    const f = F[k], v = S(d, k);
    if (f.type === 'choice' || f.type === 'mode') return (f.opts.find((o) => o[0] === v) || ['', ''])[1];
    if (f.type === 'break') return v.on ? `${v.min} min` : 'Off';
    if (f.type === 'knock') return v.on ? (f.opts.find((o) => o[0] === v.sens) || ['', ''])[1] : 'Off';
    if (f.type === 'long') return v.on ? `After ${v.min} min` : 'Off';
    return '';
  }
  const row = (k, title, sub, value) => `<button class="cell" data-action="cs2-feature" data-k="${k}">
      <span class="cell-main"><span class="cell-title" style="display:block">${esc(title)}</span>${sub ? `<span class="cell-sub" style="display:block">${esc(sub)}</span>` : ''}</span>
      ${value ? `<span class="cell-value">${esc(value)}</span>` : ''}${icon('chevron-right', 'chev')}</button>`;
  const sw = (key, title, sub, on, dis) => `<button class="cell" data-action="cn-toggle" data-n="${key}" role="switch" aria-checked="${on}" ${dis ? 'aria-disabled="true"' : ''}>
      <span class="cell-main"><span class="cell-title" style="display:block">${esc(title)}</span>${sub ? `<span class="cell-sub" style="display:block">${esc(sub)}</span>` : ''}</span>
      <span class="switch" aria-hidden="true" aria-checked="${on}" ${dis ? 'style="opacity:.4"' : ''}></span></button>`;

  function settings(d) {
    let h = '';
    const ks = Object.keys(F).filter((k) => F[k].grp === 'Sensor' && has(d, k));
    if (ks.length) h += `<div class="list-header">Sensor</div><div class="list">${ks.map((k) => row(k, F[k].name, '', summary(d, k))).join('')}</div>`;
    if (has(d, 'notify') || has(d, 'openTooLong')) {
      // On/off notification rules switch right in the row (no sheet); "Left open too long" needs a time → sheet
      let r = '';
      if (has(d, 'notify')) {
        const n = S(d, 'notify');
        r += sw('open', 'When it opens', '', n.open) + sw('close', 'When it closes', '', n.close)
          + sw('armed', 'Only when nobody is home', 'Uses the home’s Away mode', n.armed, !n.open && !n.close);
        if (has(d, 'tamper')) r += sw('tamper', 'When the cover is removed', '', n.tamper);
      }
      if (has(d, 'openTooLong')) r += row('openTooLong', F.openTooLong.name, '', summary(d, 'openTooLong'));
      h += `<div class="list-header">Notifications</div><div class="list">${r}</div><div class="list-footer">Battery low and offline messages are always on.</div>`;
    }
    return h;
  }

  const stepper = (act, val, unit) => `<div class="stepper"><button data-action="${act}" data-d="-1" aria-label="Less">−</button><output data-num>${val} ${unit}</output><button data-action="${act}" data-d="1" aria-label="More">+</button></div>`;
  const radio = (act, cur, opts) => opts.map((o) => `<button class="option" role="radio" aria-checked="${cur === o[0]}" data-action="${act}" data-v="${o[0]}">
      <span class="option-main"><span class="option-title" style="display:block">${esc(o[1])}</span>${o[2] ? `<span class="option-sub" style="display:block">${esc(o[2])}</span>` : ''}</span><span class="radio">${icon('radio-on')}</span></button>`).join('');

  function openFeature(d, k, ctx) {
    const f = F[k];
    const commit = () => { Store.save(); ctx.render(); s.refresh(); };
    const s = UI.sheet({
      title: f.name, sub: esc(f.short),
      render: () => {
        const v = S(d, k);
        if (f.type === 'choice') return `<div class="list">${radio('cf2-opt', v, f.opts)}</div>`;
        if (f.type === 'mode') {
          return `<div class="list">${radio('cf2-opt', v, f.opts)}</div>`
            + UI.collapse(v === 'counter', UI.group('Meter', `<div class="cell"><span class="cell-main cell-title">Litres per pulse</span>${stepper('cf2-pl', S(d, 'pulseL'), 'L')}</div>`)
              + '<div class="list-footer">Our app turns pulses into litres. The sensor only counts.</div>');
        }
        if (f.type === 'break') {
          return `<div class="list"><button class="cell" data-action="cf2-toggle"><span class="cell-main cell-title">Allow airing break</span><span class="switch" role="switch" aria-checked="${v.on}"></span></button>
            ${UI.collapse(v.on, `<div class="cell"><span class="cell-main cell-title">Break length</span>${stepper('cf2-min', v.min, 'min')}</div>`)}</div>
            <div class="list-footer">When the time is up, an open window counts again.</div>`;
        }
        if (f.type === 'knock') {
          return `<div class="list"><button class="cell" data-action="cf2-toggle"><span class="cell-main cell-title">Detect knocks</span><span class="switch" role="switch" aria-checked="${v.on}"></span></button></div>`
            + UI.collapse(v.on, UI.group('Sensitivity', radio('cf2-sens', v.sens, f.opts)) + '<div class="list-footer">Too sensitive: slammed doors and passing trucks count too. Start at Medium.</div>');
        }
        if (f.type === 'long') {
          const suggest = isCold(d) && v.min !== 2;
          return `<div class="list"><button class="cell" data-action="cf2-toggle"><span class="cell-main cell-title">Notify when left open</span><span class="switch" role="switch" aria-checked="${v.on}"></span></button>
            ${UI.collapse(v.on, `<div class="cell"><span class="cell-main cell-title">After</span>${stepper('cf2-min', v.min, 'min')}</div>`)}</div>
            ${UI.collapse(v.on && suggest, `<div class="pad" style="margin-top:12px"><button class="btn btn-secondary btn-block" data-action="cf2-two">Fridge: notify after 2 min</button></div>`)}
            <div class="list-footer">Our server counts the minutes. The sensor itself does nothing special.</div>`;
        }
        return '';
      },
      footer: '<button class="btn btn-primary btn-block" data-action="sheet-close">Done</button>',
    });
    const STEPS = { breakFn: [1, 15], openTooLong: [1, 240] };
    UI.on({
      'cf2-opt': ({ v }) => {
        d.settings[k] = typeof f.def === 'number' ? +v : v;
        if (k === 'counter' && v === 'counter') { d.st.open = false; d.st.tilt = false; d.phys.open = false; d.phys.pending = 0; }
        commit();
      },
      'cf2-toggle': () => { S(d, k).on = !S(d, k).on; commit(); },
      'cf2-sens': ({ v }) => { S(d, k).sens = v; commit(); },
      'cf2-min': ({ d: dir }) => {
        const v = S(d, k), [a, z] = STEPS[k];
        const st = k === 'openTooLong' ? (v.min < 10 ? 1 : v.min < 60 ? 5 : 30) : 1;
        v.min = Math.min(z, Math.max(a, v.min + st * dir)); commit();
      },
      'cf2-two': () => { S(d, k).min = 2; S(d, k).on = true; commit(); },
      'cf2-pl': ({ d: dir }) => { d.settings.pulseL = Math.min(100, Math.max(1, S(d, 'pulseL') + (S(d, 'pulseL') < 10 ? 1 : 5) * dir)); commit(); },
    });
  }

  /* ---------- Display as (what it is fixed to) + icon (avatar pen) — same sheets as the relay ---------- */
  function displayRow(d) {
    return `<button class="cell" data-action="rs-display"><span class="cell-main cell-title">Display As</span><span class="cell-value">${esc(displayOf(d).name)}</span>${icon('chevron-right', 'chev')}</button>`;
  }
  function openDisplayPicker(d, ctx) {
    UI.sheet({
      title: 'Display as', sub: 'What the sensor is fixed to — sets the picture and the icon',
      render: () => `<div class="list">${DISPLAY.map((x) => `<button class="option" role="radio" aria-checked="${kind(d) === x.k}" data-action="cd-pick" data-v="${x.k}">
        <span class="cell-icon" style="color:var(--label-secondary)">${icon(x.icons[0][0])}</span><span class="option-main"><span class="option-title" style="display:block">${esc(x.name)}</span><span class="option-sub" style="display:block">${esc(x.sub)}</span></span><span class="radio">${icon('radio-on')}</span></button>`).join('')}</div>`,
    });
    UI.on({
      'cd-pick': ({ v }) => {
        d.display = v; if (!iconsOf(d).includes(d.icon)) d.icon = iconsOf(d)[0];
        Store.save(); UI.closeSheet(); ctx.render();
      },
    });
  }
  function openIconPicker(d, ctx) {
    UI.sheet({
      title: 'Select an icon', sub: 'Only a picture — the sensor works the same everywhere',
      render: () => `<section class="sheet-group"><div class="list-header group-title">${esc(displayOf(d).name)}</div></section>
        <div class="pad icon-grid labeled">${displayOf(d).icons.map(([n, l]) => `<button data-action="ci-pick" data-k="${n}" aria-pressed="${iconOf(d) === n}">${icon(n, 'icon', 'style="width:28px;height:28px"')}<span>${esc(l)}</span></button>`).join('')}</div>`,
      footer: '<button class="btn btn-secondary btn-block" data-action="sheet-close">Done</button>',
    });
    UI.on({
      'ci-pick': ({ k }) => {
        d.icon = k; Store.save(); UI.closeSheet(); ctx.render();
        if (isCold(d) && has(d, 'openTooLong') && S(d, 'openTooLong').min !== 2) UI.toast('Tip: a fridge is usually checked after 2 min — see Notifications');
      },
    });
  }

  /* ---------- Event history (Settings → Event History) ---------- */
  const EV = { open: 'Opened', tilt: 'Tilted', close: 'Closed', tamper: 'Cover removed', cover: 'Cover back on', knock: 'Knock on the glass', long: 'Still open', battery: 'Battery low', break: 'Airing break started', breakEnd: 'Airing break over' };
  function strip(d) {
    const t0 = startOfDay(), now = Date.now(), span = 86400000;
    const evs = d.log.filter((e) => e.t >= t0 && ['open', 'tilt', 'close'].includes(e.k)).slice().reverse();
    // was it open at midnight?
    const before = d.log.find((e) => e.t < t0 && ['open', 'tilt', 'close'].includes(e.k));
    let openAt = before && before.k !== 'close' ? t0 : null; const segs = [];
    for (const e of evs) { if (e.k !== 'close') { if (openAt === null) openAt = e.t; } else if (openAt !== null) { segs.push([openAt, e.t]); openAt = null; } }
    if (openAt !== null) segs.push([openAt, now]);
    const pct = (t) => ((t - t0) / span) * 100;
    return `<div class="ct-strip"><div class="bar">${segs.map(([a, z]) => `<i style="left:${pct(a).toFixed(2)}%;width:max(3px,${(pct(z) - pct(a)).toFixed(2)}%)"></i>`).join('')}<b style="left:${pct(now).toFixed(2)}%"></b></div>
      <div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div></div>`;
  }
  function openHistory(d) {
    const day = startOfDay();
    UI.sheet({
      title: 'Event History', sub: `${timesText(opensToday(d))} · orange = open`,
      render: () => {
        const rows = d.log.slice(0, 20).map((e) => {
          const when = e.t >= day ? UI.fmtTime(e.t) : e.t >= day - 86400000 ? 'Yesterday ' + UI.fmtTime(e.t) : new Date(e.t).toLocaleDateString();
          const title = e.k === 'long' ? `Still open after ${e.min} min` : EV[e.k] || e.k;
          return `<div class="cell"><span class="cell-main cell-title">${esc(title)}</span><span class="cell-value">${when}</span></div>`;
        }).join('');
        return UI.group('Today', `<div class="group-pad">${strip(d)}</div>`) + UI.group('Events', rows || '<div class="cell"><span class="cell-main cell-sub">Nothing yet</span></div>')
          + '<div class="list-footer">Stored by our server. The sensor itself keeps no history.</div>';
      },
      footer: '<button class="btn btn-primary btn-block" data-action="sheet-close">Done</button>',
    });
  }

  function bindSettings(d, ctx) {
    UI.on({
      'cs2-feature': ({ k }) => openFeature(d, k, ctx),
      'cn-toggle': ({ n }) => {
        const v = S(d, 'notify');
        if (n === 'armed' && !v.open && !v.close) { UI.toast('Turn on “When it opens” or “When it closes” first'); return; }
        v[n] = !v[n]; Store.save(); ctx.render();
      },
      'rs-icon': () => openIconPicker(d, ctx),
      'rs-display': () => openDisplayPicker(d, ctx),
      'rs-history': () => openHistory(d),
      'rs-identify': () => {
        if (!d.online) return UI.toast('The sensor is offline');
        d.blinkAt = Date.now(); Store.save();
        UI.toast('The sensor blinks. Asleep? Press its button first');
      },
    });
  }

  function about(d) {
    const rows = [];
    if (counterMode(d)) rows.push(['Mode', 'Pulse counter'], ['Pulses counted', String(d.st.pulses)]);
    else rows.push(['Reported state', stateWord(d)], ['Last change', `${UI.fmtTime(d.st.at)}`]);
    rows.push(['Last report', d.online ? 'Just now' : UI.fmtTime(d.st.lastSeen)]);
    if (has(d, 'battery')) rows.push(['Battery', `${d.battery} % · ${(2.6 + d.battery / 250).toFixed(2)} V`]);
    if (has(d, 'tamper')) rows.push(['Cover', d.st.tamper ? 'Removed' : 'Closed']);
    return rows;
  }

  /* ==========================================================================
     Prototype panel (desktop only) — the real world: the door, the sensor, the home.
     ========================================================================== */
  function protoPanel(d) {
    const g = (grp) => Object.keys(F).filter((k) => F[k].grp === grp);
    const ph = d.phys, wait = ph.pending ? Math.ceil((ph.pending - Date.now()) / 1000) : 0;
    const where = counterMode(d) ? 'Meter dial' : displayOf(d).noun;
    return `<div class="pp-title">Contact sensor prototype</div>
      <p class="pp-note">Not part of the app. Change what this sensor supports and play the real world. Spec: <a href="../Device%20Interface%203/3.%20Contact_Sensor_Interface.html" target="_blank">Contact_Sensor_Interface</a></p>
      <h3>Real sensor</h3>
      <select data-pp="preset">${PRESETS.map((p) => `<option value="${p.id}" ${p.id === d.preset ? 'selected' : ''}>${p.name}</option>`).join('')}</select>
      <h3>${where}${counterMode(d) ? '' : ` · <span style="font-weight:400">${ph.open ? (ph.tilt ? 'tilted' : 'open') : 'closed'}${wait ? ` · reports in ${wait} s` : ''}</span>`}</h3>
      <div class="pp-row">${counterMode(d)
        ? '<button class="pp-btn" data-action="pp-pulse">🔢 Magnet passes</button>'
        : `<button class="pp-btn" data-action="pp-move" data-o="1">🟠 Open</button>${canTilt(d) && kind(d) === 'window' ? '<button class="pp-btn" data-action="pp-move" data-o="tilt">↘ Tilt</button>' : ''}<button class="pp-btn" data-action="pp-move" data-o="0">✅ Close</button>`}</div>
      <h3>The sensor</h3>
      <div class="pp-row"><button class="pp-btn" data-action="pp-button">🔘 Press its button</button>
        ${has(d, 'tamper') ? `<button class="pp-btn" data-action="pp-tamper">${d.st.tamper ? '🔧 Put the cover back' : '🪛 Remove the cover'}</button>` : ''}
        ${has(d, 'vibration') ? '<button class="pp-btn" data-action="pp-knock">🔨 Knock on the glass</button>' : ''}</div>
      <div class="pp-row">${has(d, 'battery') ? `<button class="pp-btn" data-action="pp-batt">🔋 ${battLow(d) ? 'New battery' : 'Battery low'}</button>` : ''}
        <button class="pp-btn" data-action="pp-online">${d.online ? '📴 Stops reporting' : '📶 Reports again'}</button></div>
      <h3>Home</h3>
      <div class="pp-row"><button class="pp-btn" data-action="pp-away">${away() ? '🛡 Away (nobody home)' : '🏠 Someone is home'}</button>
        <button class="pp-btn" data-action="pp-fast">${d.sim.fast ? '⏩ 1 s = 1 min' : '⏱ Real time'}</button></div>
      <h3>Features this sensor has</h3>
      ${ALL_GROUPS.map((grp) => `<div class="pp-group">${grp}</div>${g(grp).map((k) => `<label class="pp-chk"><input type="checkbox" data-pp="feat" value="${k}" ${has(d, k) ? 'checked' : ''}> ${F[k].name}${F[k].app ? ' <small style="opacity:.6">(our app)</small>' : ''}</label>`).join('')}`).join('')}
      <h3>Data</h3><button class="pp-btn" data-action="pp-reset">Reset all prototype data</button>`;
  }
  function bindProto(d, ctx) {
    const panel = document.getElementById('protoPanel'); if (!panel) return;
    const commit = (msg) => { Store.save(); ctx.render(); if (msg) UI.toast(msg); };
    panel.onchange = (e) => {
      const t = e.target;
      if (t.dataset.pp === 'preset') {
        const p = PRESETS.find((x) => x.id === t.value);
        Object.assign(d, { preset: p.id, model: p.model, manufacturer: p.manufacturer, originalName: p.name, features: p.feats.slice(), settings: {}, display: p.ic, icon: null });
        if (p.v) Object.assign(d.settings, clone(p.v));
        applyDefaults(d);
      }
      if (t.dataset.pp === 'feat') { if (t.checked) d.features.push(t.value); else d.features = d.features.filter((k) => k !== t.value); applyDefaults(d); }
      commit();
    };
    UI.on({
      'pp-move': ({ o }) => commit(move(d, o !== '0', o === 'tilt')),
      'pp-pulse': () => { move(d, true); move(d, false); commit(); },
      'pp-button': () => {
        d.blinkAt = Date.now();
        if (has(d, 'breakFn') && S(d, 'breakFn').on && d.online) {
          d.st.breakUntil = Date.now() + (S(d, 'breakFn').min * 60000) / speed(d); logEv(d, 'break');
          return commit(`Airing break for ${S(d, 'breakFn').min} min — open the window, no alert`);
        }
        commit('The button wakes the sensor — it sends a report');
      },
      'pp-tamper': () => {
        d.st.tamper = !d.st.tamper; d.blinkAt = Date.now(); logEv(d, d.st.tamper ? 'tamper' : 'cover');
        if (d.st.tamper && has(d, 'notify') && S(d, 'notify').tamper) notifyPush(d, 'Sensor tampered', `${W(d)}: the cover was opened`, 'danger');
        commit();
      },
      'pp-knock': () => {
        if (!S(d, 'vibration').on) return commit('Knock detection is off in Settings');
        d.knockAt = Date.now(); d.blinkAt = Date.now(); logEv(d, 'knock');
        notifyPush(d, 'Knock detected', `${W(d)}: a blow on the glass`, away() ? 'danger' : 'warn');
        commit();
      },
      'pp-batt': () => {
        d.battery = battLow(d) ? 100 : 14;
        if (battLow(d)) { logEv(d, 'battery'); notifyPush(d, 'Battery low', `${W(d)} sensor · ${d.battery} %`, 'warn'); }
        commit();
      },
      'pp-online': () => {
        d.online = !d.online;
        if (!d.online) return commit();
        d.st.lastSeen = Date.now(); d.blinkAt = Date.now();
        // back online: it reports what the door is doing now
        if (!counterMode(d) && (d.phys.open !== d.st.open || !!d.phys.tilt !== !!d.st.tilt)) report(d, d.phys.open, d.phys.tilt);
        commit();
      },
      'pp-away': () => { Store.state.away = !away(); commit(away() ? 'Home set to Away (an app setting for the whole home)' : 'Someone is home'); },
      'pp-fast': () => { d.sim.fast = !d.sim.fast; commit(); },
      'pp-reset': () => { Store.reset(); location.href = 'index.html'; },
    });
  }

  return {
    label: 'Contact sensor', F, PRESETS, DISPLAY, create, applyDefaults,
    icon: (d) => iconOf(d),
    avatarIcon: (d) => iconOf(d),
    displayRow,
    describe: (p) => `${p.manufacturer} · ${p.ic === 'window' ? 'window' : 'door / window'} sensor`,
    historyValue: (d) => (has(d, 'history') ? `${opensToday(d)} today` : null),
    homeTiles, page, bindPage, live, afterRender, settings, bindSettings, about, tick,
    busy: (d) => d.st.open || !!d.phys.pending || breakOn(d),
    protoPanel, bindProto,
    presetName: (id) => (PRESETS.find((p) => p.id === id) || {}).name,
    _move: move,   // used by tools/checks
  };
})();

;
/* ===== js/devices/light.js ===== */
/* ==========================================================================
   Light device interface (smart bulbs, LED strips, dimmer switches / modules)
   Source: "Device Interface 3 / 1. Light_Interface.html" (zigbee2mqtt, 1 940 lights)
   Look: Figma light sketches (6560:50289) redone in the current Samo-home style (relay / curtain / contact).
   Rule: show a control only if the paired light has that feature.
   Spec notes followed: brightness 1–100 % (a slider on an off light turns it on); white tone in kelvin within
   the bulb's range; "Effects" lists only mood effects — the signal effects (blink, okay…) are used by
   "Find this device", never shown as a menu.
   ========================================================================== */
Devices.light = (() => {
  const esc = UI.esc;

        <div class="pad lt-chips" data-key="fx">${fx.map((n) => `<button class="cw-chip" data-action="lt-fx" data-n="${n}" aria-pressed="${!!(c.fx && c.fx.name === n)}" ${ok ? '' : 'disabled'}>${MOOD[n]}</button>`).join('')}</div>`;
    }

    // 3. Settings you open
    if (has(d, 'timer')) {
      const t = c.timer;
      h += `<div class="list" data-key="controls" style="margin-top:24px"><button class="cell has-icon" data-action="lt-timer"><span class="cell-icon">${icon('clock')}</span>
        <span class="cell-main cell-title">Timer</span><span class="cell-value" data-num data-live="timer">${t ? `Off in ${UI.fmtDur((t.end - Date.now()) / 1000)}` : ''}</span>${icon('chevron-right', 'chev')}</button></div>`;
    }
    // 4. Information
    if (has(d, 'power')) {
      const w = watts(d);
      h += `<div class="v2-head muted" data-key="pw-head"><span>Power & energy</span></div>
        <div class="pad info-grid" data-key="pw">
          <div class="info-card"><span>Power</span><b data-num="count" data-live="w">${w.toFixed(1)}W</b></div>
          <div class="info-card"><span>Voltage</span><b data-num="count">${d.online ? '230V' : '—'}</b></div>
          <div class="info-card"><span>Current</span><b data-num="count" data-live="amp">${(w / 229.6).toFixed(2)}A</b></div>
          <div class="info-card"><span>Energy (total)</span><b data-num="count" data-live="kwh">${d.energy.toFixed(2)}kWh</b></div>
          ${has(d, 'deviceTemp') ? `<div class="info-card wide"><span>Device temperature</span><b data-num="count">${d.online ? d.temp + '°C' : '—'}</b>${icon('sensor-temperature')}</div>` : ''}
        </div>`;
    } else if (has(d, 'deviceTemp')) h += `<div class="pad info-grid" data-key="tmp" style="margin-top:32px"><div class="info-card wide"><span>Device temperature</span><b data-num="count">${d.online ? d.temp + '°C' : '—'}</b>${icon('sensor-temperature')}</div></div>`;
    return h + '<div style="height:28px"></div>';
  }

  /** Per-second update without re-render: countdowns, sunrise / sunset, power numbers */
  function live(d, root) {
    const i = sel(d), c = d.channels[i];
    UI.setNum(root.querySelector('[data-live="sub"]'), subLine(d, 0));
    d.channels.forEach((_, j) => UI.setNum(root.querySelector(`[data-live="st${j}"]`), chStatus(d, j)));
    const t = root.querySelector('[data-live="timer"]'); if (t) UI.setNum(t, c.timer ? `Off in ${UI.fmtDur((c.timer.end - Date.now()) / 1000)}` : '');
    UI.setNum(root.querySelector('[data-live="w"]'), watts(d).toFixed(1) + 'W');
    UI.setNum(root.querySelector('[data-live="amp"]'), (watts(d) / 229.6).toFixed(2) + 'A');
    UI.setNum(root.querySelector('[data-live="kwh"]'), d.energy.toFixed(2) + 'kWh');
    if (c.fx && (c.fx.name === 'sunrise' || c.fx.name === 'sunset')) paint(d, root);
  }
  /** Paint the selected gang's sliders and numbers — used while dragging (no re-render) */
  function paint(d, root) {
    const i = sel(d), c = d.channels[i], [k0, k1] = kRange(d);
    const br = root.querySelector('[data-lt="br"]'); if (br) { br.style.setProperty('--v', c.br / 100); br.setAttribute('aria-valuenow', c.br); }
    UI.setNum(root.querySelector('[data-live="br"]'), canCtl(d, i) && c.on ? c.br + '%' : '–');
    const ct = root.querySelector('[data-lt="ct"]'); if (ct) { ct.style.setProperty('--v', clamp((c.k - k0) / (k1 - k0), 0, 1)); ct.classList.toggle('is-colour', c.mode === 'hs'); ct.setAttribute('aria-valuenow', c.k); }
    UI.setNum(root.querySelector('[data-live="k"]'), c.k + ' K');
    const f = root.querySelector('[data-lt="hs"]'); if (f) { f.style.setProperty('--x', c.px ?? 0.5); f.style.setProperty('--y', c.py ?? 0.5); const r = f.querySelector('.lt-ring'); r.classList.toggle('hidden', c.mode !== 'hs'); r.style.background = knobColor(c); }
  }

  function bindPage(d, ctx) {
    const commit = (msg) => { Store.save(); ctx.render(); if (msg) UI.toast(msg); };
    UI.on({
      'lt-toggle': ({ ch }) => { const w = why(d, +ch); toggle(d, +ch); commit(w); UI.pulse(UI.screen.querySelector(`[data-action="lt-toggle"][data-ch="${ch}"]`), 'just-toggled'); },
      'lt-sel': ({ ch }) => { d.sel = +ch; commit(); },
      'lt-white': () => { const c = d.channels[sel(d)]; c.mode = 'ct'; c.fx = c.fx && c.fx.name === 'colorloop' ? null : c.fx; commit(); },
      'lt-swatch': ({ n }) => {
        const c = d.channels[sel(d)], s = SWATCH.find((x) => x[0] === n);
        if (n === 'white') c.mode = 'ct'; else { setColour(c, s[1], s[2] || undefined); Object.assign(c, { h: s[3][0], s: s[3][1] }); }
        if (c.fx && c.fx.name === 'colorloop') c.fx = null;
        commit();
      },
      'lt-fx': ({ n }) => { const w = why(d, sel(d)); startFx(d, sel(d), n); commit(w); },   // the chip shows the state; toast only when it can't run
      'lt-timer': () => openTimer(d, ctx),
    });
    // sliders and the colour field: follow the finger 1:1, write numbers live, save on release
    if (bindPage.bound) return; bindPage.bound = true;
    UI.screen.addEventListener('pointerdown', (e) => {
      const el = e.target.closest('[data-lt]'); if (!el || el.getAttribute('aria-disabled') === 'true') return;
      e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      el.classList.add('dragging');
      const kind = el.dataset.lt, i = sel(d), c = d.channels[i], [k0, k1] = kRange(d);
      const apply = (ev) => {
        const r = el.getBoundingClientRect(), fx = clamp((ev.clientX - r.left) / r.width, 0, 1), fy = clamp((ev.clientY - r.top) / r.height, 0, 1);
        if (kind === 'br') { c.br = Math.max(1, Math.round(fx * 100)); if (!c.on) { c.on = true; c.timer = null; } if (c.fx && (c.fx.name === 'sunrise' || c.fx.name === 'sunset')) c.fx = null; }
        if (kind === 'ct') { c.k = Math.round((k0 + (k1 - k0) * fx) / 100) * 100; c.mode = 'ct'; }
        if (kind === 'hs') { setColour(c, toHex(pickRGB(fx, fy)), [fx, fy]); if (c.fx && c.fx.name === 'colorloop') c.fx = null; }
        paint(d, UI.screen);
      };
      apply(e);
      const move = (ev) => apply(ev);
      const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); el.classList.remove('dragging'); commit(); };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
    UI.screen.addEventListener('keydown', (e) => {   // keyboard: arrows move the focused slider
      const el = e.target.closest && e.target.closest('[data-lt]'); if (!el || el.getAttribute('aria-disabled') === 'true') return;
      const dir = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!dir) return;
      e.preventDefault(); const c = d.channels[sel(d)], [k0, k1] = kRange(d);
      if (el.dataset.lt === 'br') { c.br = clamp(c.br + dir * 5, 1, 100); c.on = true; }
      if (el.dataset.lt === 'ct') { c.k = clamp(c.k + dir * 100, k0, k1); c.mode = 'ct'; }
      if (el.dataset.lt === 'hs') { const px = clamp((c.px ?? 0.5) + dir * 0.04, 0, 1), py = c.py ?? 0.3; setColour(c, toHex(pickRGB(px, py)), [px, py]); }
      paint(d, UI.screen); Store.save();
    });
  }
  function afterRender(d, root) { const tg = root.querySelector('.lt-toggle'); if (tg && d.blinkAt && Date.now() - d.blinkAt < 1500 && tg.dataset.blink !== String(d.blinkAt)) { tg.dataset.blink = d.blinkAt; UI.pulse(tg, 'blink'); } }

  /* ---------- Timer sheet: the shared one (UI.timerSheet — presets + Custom wheel) ---------- */
  function openTimer(d, ctx) {
    const i = sel(d);
    UI.timerSheet({
      sub: esc(F.timer.short),
      running: () => d.channels[i].timer,
      start: (sec) => { const m = startTimer(d, i, sec); Store.save(); ctx.render(); return m; },
      cancel: () => { d.channels[i].timer = null; Store.save(); ctx.render(); },
      lastCustom: () => d.tmCustom, saveCustom: (sec) => { d.tmCustom = sec; },
    });
  }

  /* ==========================================================================
     Settings
     ========================================================================== */
  function summary(d, k) {
    if (!F[k].perCh || !multi(d)) return { value: valText(d, k) };
    const vals = d.channels.map((_, i) => valText(d, k, i));
    if (vals.every((v) => v === vals[0])) return { value: vals[0] };
    const line = d.channels.map((c, i) => `${c.name}: ${vals[i]}`).join(' · ');
    return line.length <= 34 ? { sub: line } : {};
  }
  function settings(d) {
    let h = '';
    if (multi(d)) {
      h += `<div class="list-header">Lights</div><div class="list">${d.channels.map((c, i) => `<button class="cell has-icon ch-row" data-action="ls-rename" data-ch="${i}"><span class="cell-icon">${icon(d.icon)}</span>
        <span class="cell-main"><span class="cell-title" style="display:block">${esc(c.name)}</span><span class="cell-sub" style="display:block">Gang ${i + 1}</span></span>${icon('chevron-right', 'chev')}</button>`).join('')}</div>`;
    }
    for (const [title, grps] of SETTINGS_CARDS) {
      const ks = grps.flatMap((g) => Object.keys(F).filter((k) => F[k].grp === g && has(d, k)));
      if (!ks.length) continue;
      h += `<div class="list-header">${title}</div><div class="list">${ks.map((k) => {
        const f = F[k];
        if (f.type === 'toggle') {
          const on = !!get(d, k);
          return `<button class="cell" data-action="ls-toggle" data-k="${k}" role="switch" aria-checked="${on}"><span class="cell-main"><span class="cell-title" style="display:block">${esc(f.name)}</span>${f.showSub ? `<span class="cell-sub" style="display:block">${esc(f.short)}</span>` : ''}</span><span class="switch" aria-hidden="true" aria-checked="${on}"></span></button>`;
        }
        const sm = summary(d, k);
        return `<button class="cell" data-action="ls-feature" data-k="${k}"><span class="cell-main"><span class="cell-title" style="display:block">${esc(f.name)}</span>${sm.sub ? `<span class="cell-sub" style="display:block">${esc(sm.sub)}</span>` : ''}</span>${sm.value ? `<span class="cell-value">${esc(sm.value)}</span>` : ''}${icon('chevron-right', 'chev')}</button>`;
      }).join('')}</div>`;
    }
    return h;
  }

  const stepper = (act, val, unit, extra = '') => `<div class="stepper"><button data-action="${act}" data-d="-1" ${extra} aria-label="Less">−</button><output data-num>${val} ${unit}</output><button data-action="${act}" data-d="1" ${extra} aria-label="More">+</button></div>`;
  const radio = (act, cur, opts) => opts.map((o) => `<button class="option" role="radio" aria-checked="${cur === o[0]}" data-action="${act}" data-v="${o[0]}"><span class="option-main"><span class="option-title" style="display:block">${esc(o[1])}</span>${o[2] ? `<span class="option-sub" style="display:block">${esc(o[2])}</span>` : ''}</span><span class="radio">${icon('radio-on')}</span></button>`).join('');

  function openFeature(d, k, ctx) {
    const f = F[k]; let c = 0;
    const commit = () => { Store.save(); ctx.render(); s.refresh(); };
    const s = UI.sheet({
      title: f.name, sub: esc(f.short),
      tabs: f.perCh && multi(d) ? () => UI.segTabs(d.channels.map((x) => x.name), c, 'lf-ch') : null,
      render: () => {
        const v = get(d, k, c);
        if (f.type === 'choice') return `<div class="list">${radio('lf-opt', v, optsFor(d, k))}</div>`;
        if (f.type === 'range') {
          return UI.group('', `<div class="cell"><span class="cell-main cell-title">Lowest</span>${stepper('lf-rng', v.min, '%', 'data-x="min"')}</div><div class="cell"><span class="cell-main cell-title">Highest</span>${stepper('lf-rng', v.max, '%', 'data-x="max"')}</div>`)
            + '<div class="list-footer">The slider still goes from 1 to 100 %; it is spread over this range.</div>';
        }
        if (f.type === 'startup') {
          return `<div class="list">${radio('lf-st', v.mode, optsFor(d, k))}</div>` + UI.collapse(v.mode === 'custom', UI.group('Comes on with',
            (has(d, 'colorTemp') ? `<div class="cell"><span class="cell-main cell-title">White tone</span>${stepper('lf-stk', v.k, 'K')}</div>` : '')
            + `<div class="cell"><span class="cell-main cell-title">Brightness</span>${stepper('lf-stb', v.br, '%')}</div>`));
        }
        if (f.type === 'btnlight') {
          const extra = presetOf(d).btnExtra && v.mode !== 'off';
          return `<div class="list">${radio('lf-bl', v.mode, optsFor(d, k))}</div>` + UI.collapse(extra,
            UI.group('Colour', `<div class="swatches group-pad sw-card">${Object.keys(BTN_COLORS).map((n) => `<button class="swatch" style="background:${BTN_COLORS[n]}" aria-pressed="${v.color === n}" aria-label="${n}" data-action="lf-blc" data-n="${n}"></button>`).join('')}</div>`)
            + UI.group('', `<div class="cell slider-row"><div class="row"><span class="cell-title grow">Brightness</span><span class="slider-val" data-num id="blVal">${v.br}%</span></div><input type="range" class="range" min="5" max="100" step="5" value="${v.br}" style="--v:${v.br / 100}" id="blRange" aria-label="Button light brightness"></div>`));
        }
        return '';
      },
      footer: '<button class="btn btn-primary btn-block" data-action="sheet-close">Done</button>',
      onMount: (el) => { const r = el.querySelector('#blRange'); if (r) { r.oninput = () => { get(d, k).br = +r.value; UI.setNum(el.querySelector('#blVal'), r.value + '%'); Store.save(); }; r.onchange = () => ctx.render(); } },
    });
    UI.on({
      'lf-ch': ({ ch }) => { c = +ch; s.refresh(); },
      'lf-opt': ({ v }) => { set(d, k, c, v); commit(); },
      'lf-rng': ({ x, d: dir }) => { const v = get(d, k, c); v[x] = clamp(v[x] + 5 * dir, x === 'min' ? 1 : v.min + 10, x === 'min' ? v.max - 10 : 100); commit(); },
      'lf-st': ({ v }) => { get(d, k).mode = v; commit(); },
      'lf-stk': ({ d: dir }) => { const v = get(d, k), [k0, k1] = kRange(d); v.k = clamp(v.k + 100 * dir, k0, k1); commit(); },
      'lf-stb': ({ d: dir }) => { const v = get(d, k); v.br = clamp(v.br + 5 * dir, 5, 100); commit(); },
      'lf-bl': ({ v }) => { get(d, k).mode = v; commit(); },
      'lf-blc': ({ n }) => { get(d, k).color = n; commit(); },
    });
  }
  function openIconPicker(d, ctx) {
    UI.sheet({
      title: 'Select an icon', render: () => `<section class="sheet-group"><div class="list-header group-title">Lighting</div></section><div class="pad icon-grid">${ICONS.map((n) => `<button data-action="li-pick" data-n="${n}" aria-pressed="${d.icon === n}" aria-label="${n.replace('dev-', '')}">${icon(n, 'icon', 'style="width:32px;height:32px"')}</button>`).join('')}</div>`,
      footer: '<button class="btn btn-secondary btn-block" data-action="sheet-close">Done</button>',
    });
    UI.on({ 'li-pick': ({ n }) => { d.icon = n; Store.save(); UI.closeSheet(); ctx.render(); } });
  }
  function bindSettings(d, ctx) {
    UI.on({
      'ls-feature': ({ k }) => openFeature(d, k, ctx),
      'ls-toggle': ({ k }) => { set(d, k, 0, !get(d, k)); Store.save(); ctx.render(); },
      'ls-rename': ({ ch }) => UI.prompt({ title: 'Rename light', label: 'Light name', value: d.channels[+ch].name, onOk: (v) => { d.channels[+ch].name = v; Store.save(); ctx.render(); UI.toast('Saved'); } }),
      'rs-icon': () => openIconPicker(d, ctx),
      'rs-identify': () => { if (!d.online) return UI.toast('Light is offline'); d.blinkAt = Date.now(); Store.save(); UI.toast('The light blinks — look around the room'); },
    });
  }
  function about(d) {
    const rows = [['Type', d.kind === 'bulb' ? 'Smart bulb' : 'Dimmer'], ['Lights', String(d.channels.length)]];
    if (has(d, 'colorTemp')) rows.push(['White tone range', `${kRange(d)[0]}–${kRange(d)[1]} K`]);
    if (has(d, 'deviceTemp')) rows.push(['Device temperature', d.online ? d.temp + ' °C' : '—']);
    if (has(d, 'outageCount')) rows.push(['Power cuts counted', String(d.outages)]);
    return rows;
  }

  /* ==========================================================================
     Prototype panel — the real world: power, the normal wall switch (bulbs), the dimmer's buttons
     ========================================================================== */
  function protoPanel(d) {
    const g = (grp) => Object.keys(F).filter((k) => F[k].grp === grp);
    const wall = d.kind === 'bulb'
      ? `<h3>Normal wall switch</h3><div class="pp-row">${d.channels.map((c, i) => `<button class="pp-btn" data-action="pp-wall" data-ch="${i}">${c.pw === false ? '🔌 Switch on' : '⭘ Switch off'}${multi(d) ? ' · ' + esc(c.name) : ''}</button>`).join('')}</div>`
      : d.channels.map((c, i) => `<div class="pp-group">Wall button · ${esc(c.name)}</div><div class="pp-row"><button class="pp-btn" data-action="pp-press" data-ch="${i}">press</button><button class="pp-btn" data-action="pp-hold" data-ch="${i}" data-dir="1">hold ▲</button><button class="pp-btn" data-action="pp-hold" data-ch="${i}" data-dir="-1">hold ▼</button></div>`).join('');
    return `<div class="pp-title">Light prototype</div>
      <p class="pp-note">Not part of the app. Change what this light supports and simulate the real world. Spec: <a href="../Device%20Interface%203/1.%20Light_Interface.html" target="_blank">Light_Interface</a></p>
      <h3>Real light</h3><select data-pp="preset">${PRESETS.map((p) => `<option value="${p.id}" ${p.id === d.preset ? 'selected' : ''}>${p.name}</option>`).join('')}</select>
      <h3>Lights (gangs)</h3><div class="pp-seg">${CH_COUNTS.map((n) => `<button class="${n === d.channels.length ? 'on' : ''}" data-action="pp-ch" data-n="${n}">${n}</button>`).join('')}</div>
      <h3>Installed as</h3><div class="pp-seg"><button class="${d.kind === 'bulb' ? 'on' : ''}" data-action="pp-kind" data-k="bulb">Smart bulb</button><button class="${d.kind === 'dimmer' ? 'on' : ''}" data-action="pp-kind" data-k="dimmer">Dimmer</button></div>
      <h3>Simulate</h3><div class="pp-row"><button class="pp-btn" data-action="pp-power">${d.online ? '⚡ Power cut' : '🔌 Restore power'}</button></div>
      ${wall}
      <h3>Features this light has</h3>
      ${ALL_GROUPS.map((grp) => `<div class="pp-group">${grp}</div>${g(grp).map((k) => `<label class="pp-chk"><input type="checkbox" data-pp="feat" value="${k}" ${has(d, k) ? 'checked' : ''}> ${F[k].name}</label>`).join('')}`).join('')}
      <h3>Data</h3><button class="pp-btn" data-action="pp-reset">Reset all prototype data</button>`;
  }
  function bindProto(d, ctx) {
    const panel = document.getElementById('protoPanel'); if (!panel) return;
    const commit = (msg) => { Store.save(); ctx.render(); if (msg) UI.toast(msg); };
    panel.onchange = (e) => {
      const t = e.target;
      if (t.dataset.pp === 'preset') {
        const p = PRESETS.find((x) => x.id === t.value);
        Object.assign(d, { preset: p.id, model: p.model, manufacturer: p.manufacturer, originalName: p.name, features: p.feats.slice(), kind: p.kind, settings: {} });
        d.channels = []; setChannelCount(d, p.ch); d.channels.forEach((c, i) => { c.name = p.names[i]; });
      }
      if (t.dataset.pp === 'feat') { if (t.checked) d.features.push(t.value); else d.features = d.features.filter((k) => k !== t.value); applyDefaults(d); }
      commit();
    };
    UI.on({
      'pp-ch': ({ n }) => { setChannelCount(d, +n); commit(); },
      'pp-kind': ({ k }) => { d.kind = k; d.channels.forEach((c) => { c.pw = true; }); commit(); },
      'pp-power': () => { if (d.online) { powerCut(d); commit('Power cut — the light is offline'); } else { powerRestore(d); commit('Power restored — it follows “After a power cut”'); } },
      'pp-wall': ({ ch }) => {
        const c = d.channels[+ch];
        if (c.pw === false) { c.pw = true; powerBack(d, +ch); commit('Wall switch on — the bulb has power again'); } else { c.before = c.on; c.pw = false; c.on = false; c.timer = null; c.fx = null; commit('Wall switch off — the bulb has no power'); }
      },
      'pp-press': ({ ch }) => commit('Wall button → ' + toggle(d, +ch)),
      'pp-hold': ({ ch, dir }) => {
        const c = d.channels[+ch]; if (why(d, +ch)) return commit(why(d, +ch));
        c.on = true; c.br = clamp(c.br + 20 * dir, 1, 100); commit(`Hold → ${c.br}%`);
      },
      'pp-reset': () => { Store.reset(); location.href = 'index.html'; },
    });
  }

  return {
    label: 'Light', F, PRESETS, create, applyDefaults,
    icon: (d) => d.icon, avatarIcon: (d) => d.icon,
    describe: (p) => `${p.manufacturer} · ${p.kind === 'bulb' ? 'smart bulb' : p.ch + '-gang dimmer'}`,
    homeTiles, toggle: (d, i) => toggle(d, i), page, bindPage, live, afterRender, settings, bindSettings, about, tick,
    busy: (d) => d.channels.some((c) => c.timer || (c.fx && (c.fx.name === 'sunrise' || c.fx.name === 'sunset'))),
    protoPanel, bindProto,
    presetName: (id) => (PRESETS.find((p) => p.id === id) || {}).name,
    _k2rgb: k2rgb,
  };
})();
