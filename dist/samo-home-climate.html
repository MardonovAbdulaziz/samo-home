  background: radial-gradient(closest-side, rgba(124,255,207,0.450) 0%, rgba(124,255,207,0.405) 15%, rgba(124,255,207,0.296) 30%, rgba(124,255,207,0.176) 45%, rgba(124,255,207,0.085) 60%, rgba(124,255,207,0.033) 75%, rgba(124,255,207,0.010) 90%, rgba(124,255,207,0.000) 100%); }

/* Channel picker (Safari fix): Safari ignores flex-basis when it sizes a <button>, so the selected pill
   was ~30 px too narrow and covered the next tab. A real width on the digit slot fixes it. */
.ch-picker button b { width: 40px; min-width: 40px; }

/* Curtain scene sits directly on the dark page (no glass card, no window frame) — the fabric is the hero */
.cw-card { background: none !important; box-shadow: none !important; padding: 0 !important; margin-top: 24px !important; }   /* room under the header: the rod never touches it */
.cw-card.can-drag:focus-visible { box-shadow: 0 0 0 3px var(--primary) !important; border-radius: 18px; }

/* curtain scene layers: window/light behind, fabric in front */
.cw-stage .cs-layer { position: absolute; inset: 0; }
.cw-stage svg.cs, .cs-mini svg.cs { position: absolute; inset: 0; }
.cs-mini { position: relative; }

/* On a real phone the device has its own status bar and home indicator: hide the mock ones (keep their space) */
@media (max-width: 520px) {
  .statusbar .time, .statusbar .levels { visibility: hidden; }
  .home-indicator { display: none; }
}

/* ===== Range slider — Figma "Button backlight" (6142:73760) =====
   Track 15 px, white, fully round; blue fill up to the thumb's centre; thumb 25 px blue with a 3 px white
   ring and the blue-glow shadow. --v (0…1) is set inline and kept current by UI (input listener). */
.range { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 25px; margin: 0; padding: 0; background: none; cursor: pointer; touch-action: pan-y; accent-color: var(--primary); --v: .5; }
.range:focus { outline: none; }
.range::-webkit-slider-runnable-track { height: 15px; border-radius: 24px;
  background: linear-gradient(90deg, var(--blue, #0A84FF) calc(12.5px + var(--v) * (100% - 25px)), var(--static-white, #fff) 0); }
.range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 25px; height: 25px; margin-top: -5px; border-radius: 50%;
  background: var(--blue, #0A84FF); border: 3px solid var(--static-white, #fff); box-shadow: 0 0 12px rgba(10, 132, 255, 0.5); box-sizing: border-box;
  transition: transform 160ms var(--ease-out); }
.range:active::-webkit-slider-thumb { transform: scale(1.12); }
.range::-moz-range-track { height: 15px; border-radius: 24px; background: var(--static-white, #fff); }
.range::-moz-range-progress { height: 15px; border-radius: 24px; background: var(--blue, #0A84FF); }
.range::-moz-range-thumb { width: 25px; height: 25px; border-radius: 50%; background: var(--blue, #0A84FF); border: 3px solid var(--static-white, #fff); box-shadow: 0 0 12px rgba(10, 132, 255, 0.5); box-sizing: border-box; }
.range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.45), 0 0 12px rgba(10, 132, 255, 0.5); }
.range[disabled] { opacity: .4; cursor: default; }
/* the row around it: label (body/lg) + value (body/md, secondary), slider 16 px below; 12 px top / 24 px bottom */
.cell.slider-row { flex-direction: column; align-items: stretch; gap: 16px; padding-top: 12px; padding-bottom: 24px; min-height: 0; }
.cell.slider-row .cell-title { font: var(--body-lg); letter-spacing: var(--body-lg-ls); }
.slider-val { font: var(--body-md); letter-spacing: var(--body-md-ls); color: var(--label-secondary); font-variant-numeric: tabular-nums; }

/* Curtain quick positions: three equal segments (Open / Close are the big buttons above) that always fit the screen */
.cw-chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; overflow: visible; padding: 0 var(--screen-pad); }
.cw-chip { min-width: 0; padding: 0 4px; justify-content: center; white-space: nowrap; font: var(--body-md-accent); letter-spacing: -0.2px; }

/* Curtain motor direction sheet: test buttons */
.dir-hint { margin: 0 0 12px; font: var(--body-md); color: var(--label-secondary); }
.dir-test { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dir-test .btn { height: 44px; gap: 6px; font: var(--body-md-accent); }
.dir-test .btn { background: var(--fill-tertiary); }

/* ===== Relay Figma pass (6195:78800) ===== */
/* Section headings: body/md, primary label, 16 px inset, 12 px to the card (settings page + sheets) */
.list-header { font: var(--body-md); letter-spacing: var(--body-md-ls); color: var(--label-primary); padding: 24px calc(var(--screen-pad) + 16px) 12px; }
.list-gap { height: 24px; }
.sheet-group .group-title { padding: 0 16px 12px; font: var(--body-md); letter-spacing: var(--body-md-ls); color: var(--label-primary); }
/* Channel rows on the settings page: grey 28 px icon, 17 px name */
.cell.ch-row .cell-icon { color: var(--label-secondary); }
.cell.ch-row .cell-title { font: var(--body-lg); letter-spacing: var(--body-lg-ls); }
/* "Turn on/off all devices": white icon (Figma 6165:76338) */
.all-action { height: 56px; border-radius: 16px; }
.all-action.turn-on .icon, .all-action.turn-off .icon { color: var(--label-primary); }
/* Select an icon (Figma 6130:72061): plain icons, selected = blue outline */
.icon-grid { gap: 12px; }
.icon-grid button { background: transparent; border-radius: 16px; }
.icon-grid button[aria-pressed="true"] { background: var(--primary-soft); }
/* Light colours (Figma 6142:73804): 36 px dots, 16 px gap, inner white selection ring */
.swatches.sw-card { gap: 16px; padding: 20px 0; }
.swatch { position: relative; border: 0; box-shadow: inset 1.2px 1.2px 2.4px rgba(255,255,255,.24); }
.swatch[aria-pressed="true"]::after { content: ''; position: absolute; inset: 4.8px; border: 2.4px solid #fff; border-radius: 50%; }
/* Steppers inside rows: compact like Figma (Delay, Protection limits) */
.cell .stepper { padding: 2px; }
.cell .stepper button { height: 30px; }
.swatch[aria-label="white"][aria-pressed="true"]::after { border-color: rgba(0,0,0,.55); }



/* ==========================================================================
   Contact sensor (door / window) — Figma style: same cards, banners and lists as relay / curtain
   ========================================================================== */
.tile-status.tone-warn > [data-num] { color: var(--orange); }
.tile-status.tone-danger > [data-num] { color: var(--red); }

/* Live picture — minimal on purpose: frame, the part that moves, the sensor and its magnet. Enough to read
   open / closed at a glance; no rooms, skies or light effects. Palette: graphite + cool greys + the app blue.
   Motion (Emil Kowalski rules): transform/opacity transitions that retarget mid-swing, ease-in-out, reduced-motion variant. */
.ct-card { position: relative; margin-top: 24px; height: 248px; display: flex; justify-content: center; align-items: center; }
.ct-stage { position: relative; width: 136px; height: 204px; margin-bottom: 20px; }
.ct-card.win .ct-stage { width: 232px; height: 164px; margin-bottom: 20px; }
/* frame with a little volume: lit from the top-left, inner bevel, soft drop shadow */
.ct-frame { position: absolute; inset: 0; border-radius: 6px 6px 2px 2px; background: linear-gradient(160deg, #474e59 0%, #353b45 45%, #2b3038 100%);
  box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .12), inset -1px -1px 0 rgba(0, 0, 0, .35), 0 18px 28px -14px rgba(0, 0, 0, .65);
  perspective: 640px; perspective-origin: 50% 45%; }
.ct-card.win .ct-frame { inset: 0 0 7px; border-radius: 6px; perspective-origin: 75% 50%; }   /* vanishing point on the moving sash */
/* the opening: clean light in the app blue, recessed — the jamb's inner faces show the wall's thickness */
.ct-hole { position: absolute; inset: 10px 10px 0; background: linear-gradient(180deg, #0b2747 0%, #1560a6 72%, #2a86d6 100%); }
.ct-card.win .ct-hole { inset: 10px; background: linear-gradient(180deg, #0b2747 0%, #1560a6 80%, #2378c4 100%); }
/* depth: a thin, soft inner shadow along the top and the hinge side — the wall's thickness without a hard band */
.ct-hole::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 3px 3px 4px rgba(0, 0, 0, .42), inset -1px 0 2px rgba(0, 0, 0, .2); }
.ct-card.win .ct-hole::after { box-shadow: inset 2px 2px 3px rgba(0, 0, 0, .4), inset -1px -1px 2px rgba(0, 0, 0, .18); }
/* window: a hint of soft light in the opened part (radial gradient, not a filter) */
.ct-card.win .ct-hole::before { content: ''; position: absolute; left: 50%; right: 0; top: 0; bottom: 0; pointer-events: none;
  background: radial-gradient(70% 55% at 55% 70%, rgba(120, 190, 255, .35), rgba(120, 190, 255, 0) 75%); opacity: 0; transition: opacity 520ms var(--ease-out); }
.ct-card.win.is-open .ct-hole::before { opacity: 1; transition: opacity 640ms var(--ease-in-out) 180ms; }
.ct-card.win.is-tilt .ct-hole::before { opacity: .45; transition: opacity 640ms var(--ease-in-out) 180ms; }
/* grounding: a soft contact shadow (no floor lines); a threshold under the door, a sill under the window — both with a lit top edge */
.ct-ground { position: absolute; left: -6%; right: -6%; top: calc(100% - 8px); height: 18px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .5), transparent); }
.ct-card.door .ct-frame::after { content: ''; position: absolute; left: -5px; right: -5px; bottom: -4px; height: 4px; border-radius: 1.5px;
  background: linear-gradient(180deg, #6a727e 0 1px, #4a515c 1px, #3a4049); }
.ct-sill { position: absolute; left: -9px; right: -9px; bottom: 0; height: 7px; border-radius: 2px; background: linear-gradient(180deg, #6a727e 0 1px, #4d5560 1px 3px, #3a4049 3px); }
/* No filter: blur() here — Safari paints it unreliably (it vanished or popped). Softness comes from gradients,
   masks and box-shadow, which every engine paints the same; only opacity animates.
   Light on the floor: a real plane lying on the floor in perspective — exactly the doorway's width where it
   leaves the threshold, wider toward you, soft sides (mask), fading out. */
/* Light on the floor: one smooth elliptical pool from the threshold, fading evenly to the sides and toward you
   (a radial gradient — no edges, no layers, no blur filter). */
.ct-beam { position: absolute; left: -30px; right: -30px; top: 100%; height: 44px; opacity: 0; will-change: opacity; transition: opacity 360ms var(--ease-out);
  background: radial-gradient(50% 100% at 50% 0%, rgba(42, 134, 214, .3), rgba(42, 134, 214, .1) 50%, rgba(42, 134, 214, 0) 100%); }
.ct-card.is-open .ct-beam { opacity: 1; transition: opacity 640ms var(--ease-in-out) 120ms; }
/* bloom: the opening's light bleeds softly past the frame (a box-shadow glow behind the frame) */
.ct-bloom { position: absolute; left: 10px; right: 10px; top: 10px; bottom: 0; border-radius: 4px; box-shadow: 0 0 22px 2px rgba(42, 134, 214, .5);
  opacity: 0; will-change: opacity; transition: opacity 360ms var(--ease-out); }
.ct-card.door.is-open .ct-bloom { opacity: .45; transition: opacity 640ms var(--ease-in-out) 120ms; }
.ct-card.win .ct-bloom { left: 52%; right: 10px; top: 10px; bottom: 17px; }
.ct-card.win.is-open .ct-bloom { opacity: .4; transition: opacity 640ms var(--ease-in-out) 180ms; }
.ct-card.win.is-tilt .ct-bloom { opacity: .2; transition: opacity 640ms var(--ease-in-out) 180ms; }

/* door: hinge left, swings away from you, darker as it turns */
.ct-leaf { position: absolute; inset: 10px 10px -1px; transform-origin: 0 50%; border-radius: 2px; backface-visibility: hidden;
  background: linear-gradient(90deg, #d8dce2, #c2c7cf); box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .55), inset -1px -1px 0 rgba(0, 0, 0, .18); transition: transform 640ms var(--ease-in-out); }
.ct-leaf::after { content: ''; position: absolute; inset: 0; background: rgba(8, 12, 18, .42); opacity: 0; transition: opacity 640ms var(--ease-in-out); }
.ct-card.is-open .ct-leaf { transform: rotateY(72deg); transition-delay: 120ms; }
.ct-card.is-open .ct-leaf::after { opacity: 1; transition-delay: 120ms; }
.ct-lever { position: absolute; right: 9px; top: 51%; width: 8px; height: 8px; border-radius: 50%; background: #8e959e; }
.ct-lever::before { content: ''; position: absolute; right: 3.5px; top: 2.25px; width: 15px; height: 3.5px; border-radius: 2px; transform-origin: 100% 50%; background: #8e959e; }
.ct-card.is-open .ct-lever::before { animation: ct-press 520ms var(--ease-in-out); }
@keyframes ct-press { 0%, 100% { transform: none; } 35%, 55% { transform: rotate(-26deg); } }

/* window: fixed pane, centre post with the sensor, sash that opens (hinge right) or tilts; the handle shows the mode */
.ct-pane, .ct-turn { position: absolute; top: 10px; bottom: 10px; }
.ct-pane { left: 10px; width: calc(50% - 14px); background: rgba(6, 13, 24, .6); }
.ct-mull { position: absolute; left: calc(50% - 4px); width: 8px; top: 10px; bottom: 10px; background: #3d444f; }
.ct-glass { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, 0) 55%); }
.ct-turn { left: calc(50% + 4px); right: 10px; transform-origin: 100% 50%; transform-style: preserve-3d; transition: transform 640ms var(--ease-in-out); }
.ct-sash { position: absolute; inset: 0; transform-origin: 50% 100%; border: 5px solid #59616d; border-radius: 2px; backface-visibility: hidden;
  border-color: #66707c #4c545f #454c56 #5d6672;   /* bevel: light top-left, shade bottom-right */
  background: rgba(6, 13, 24, .6); transition: transform 640ms var(--ease-in-out); }
.ct-shade { position: absolute; inset: 0; background: rgba(8, 12, 18, .3); opacity: 0; transition: opacity 640ms var(--ease-in-out); }
/* the move that leaves starts at once, the move that arrives waits for the handle (and for the other move to clear) */
.ct-card.win.is-open .ct-turn { transform: rotateY(52deg); transition-delay: 180ms; }
.ct-card.win.is-tilt .ct-sash { transform: rotateX(-18deg); transition-delay: 180ms; }
.ct-card.win.is-open .ct-shade, .ct-card.win.is-tilt .ct-shade { opacity: 1; transition-delay: 180ms; }
.ct-card.win.is-tilt .ct-shade { background: linear-gradient(180deg, rgba(8, 12, 18, .5), rgba(8, 12, 18, .12) 60%); }
.ct-whandle { position: absolute; left: -2px; top: calc(50% - 4px); width: 8px; height: 8px; border-radius: 2px; background: #c9ced5; transform-origin: 50% 50%; transition: transform 220ms var(--ease-in-out) 480ms; }
.ct-whandle::before { content: ''; position: absolute; left: 2.25px; top: 4px; width: 3.5px; height: 15px; border-radius: 2px; background: #c9ced5; }
.ct-card.win.is-open .ct-whandle { transform: rotate(-90deg); transition-delay: 0ms; }
.ct-card.win.is-tilt .ct-whandle { transform: rotate(-180deg); transition-delay: 0ms; }

/* sensor on the frame, magnet on the moving part */
.ct-magnet { position: absolute; right: 3px; top: 22px; width: 6px; height: 18px; border-radius: 2px; background: #f4f5f7; }
.ct-sash .ct-magnet { right: auto; left: -4px; top: 12px; width: 5px; height: 16px; }
.ct-sensor { position: absolute; right: 1px; top: 28px; width: 8px; height: 26px; }
.ct-card.win .ct-sensor { right: auto; left: calc(50% - 3.5px); top: 22px; width: 7px; height: 24px; }
.ct-base, .ct-cover { position: absolute; inset: 0; border-radius: 2.5px; }
.ct-base { background: #6f7680; transition: box-shadow var(--dur) var(--ease-out); }
.ct-cover { background: #f4f5f7; box-shadow: 0 1px 2px rgba(0, 0, 0, .35); transition: transform 320ms var(--ease-out); }
.ct-led { position: absolute; left: 50%; top: 4px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: rgba(0, 0, 0, .14); }
.ct-wave { position: absolute; left: 50%; top: 40%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 1.5px solid rgba(62, 160, 255, .9); opacity: 0; pointer-events: none; }
.ct-card.blink .ct-led { animation: ct-led 900ms var(--ease-out); }
.ct-card.blink .ct-wave { animation: ct-wave 900ms var(--ease-out); }
.ct-card.blink .ct-wave.w2 { animation-delay: 160ms; }
@keyframes ct-led { 0%, 55% { background: #3ea0ff; box-shadow: 0 0 6px 2px rgba(62, 160, 255, .85); } 100% { background: rgba(0, 0, 0, .14); box-shadow: none; } }
@keyframes ct-wave { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(2.8); } }
.ct-card.is-tamper .ct-cover { transform: translate(9px, 18px) rotate(24deg); }
.ct-card.is-tamper .ct-base { box-shadow: 0 0 0 1.5px var(--red), 0 0 12px rgba(255, 69, 58, .65); }

/* other: just the sensor and its magnet; the magnetic field fades as the magnet moves away */
.ct-card.other .ct-stage { width: 220px; height: 160px; }
.ct-shadow { position: absolute; left: 68px; width: 50px; top: 131px; height: 10px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .32), transparent); }
.ct-mshadow { position: absolute; left: -3px; right: -3px; top: calc(100% + 1px); height: 8px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .28), transparent); }
.ct-card.other .ct-sensor { right: auto; left: 70px; top: 20px; width: 46px; height: 116px; }
.ct-card.other .ct-base, .ct-card.other .ct-cover { border-radius: 12px; }
.ct-card.other .ct-cover { box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.ct-card.other .ct-led { top: 14px; width: 7px; height: 7px; margin-left: -3.5px; }
.ct-card.other .ct-wave { width: 40px; height: 40px; margin: -20px 0 0 -20px; top: 12%; }
.ct-card.other.is-tamper .ct-cover { transform: translate(20px, 46px) rotate(24deg); }
.ct-mag { position: absolute; left: 122px; top: 38px; width: 28px; height: 80px; border-radius: 9px; background: #f4f5f7; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform 640ms var(--ease-in-out); }
.ct-mark { position: absolute; left: 4px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left: 7px solid #c3c8cf; border-right: 0; }
.ct-card.other.is-open .ct-mag { transform: translateX(64px) rotate(8deg); }
.ct-field { position: absolute; left: 114px; top: 50px; width: 12px; height: 56px; border: 2px dashed rgba(62, 160, 255, .55); border-left: 0; border-radius: 0 30px 30px 0; transition: opacity 400ms var(--ease-out); }
.ct-card.other.is-open .ct-field { opacity: 0; }

.ct-card.knock .ct-leaf, .ct-card.knock .ct-sash, .ct-card.knock .ct-mag { animation: ct-knock 420ms var(--ease-out); }
@keyframes ct-knock { 0%, 100% { translate: 0 0; } 15% { translate: -2.5px 0; } 30% { translate: 2.5px 0; } 45% { translate: -1.5px 0; } 60% { translate: 1.5px 0; } 75% { translate: -.5px 0; } }
.ct-card.is-off .ct-stage { opacity: .45; }
@media (prefers-reduced-motion: reduce) {   /* fewer, gentler: the state still changes, nothing swings or shakes */
  .ct-leaf, .ct-turn, .ct-sash, .ct-whandle, .ct-cover, .ct-mag { transition-duration: 1ms !important; transition-delay: 0ms !important; }
  .ct-card .ct-wave, .ct-card.knock .ct-leaf, .ct-card.knock .ct-sash, .ct-card.knock .ct-mag, .ct-card.is-open .ct-lever::before { animation: none !important; }
}

/* readout under the picture: state word in its colour + "Since 08:13" / "For 5 min" */
.ct-readout { padding-top: 20px; }
.ct-word { font: 700 34px/40px var(--font); letter-spacing: 0.4px; color: var(--label-primary); transition: color var(--dur) var(--ease-out); }
.ct-word.closed { color: var(--green); }
.ct-word.open { color: var(--orange); }
.ct-count { padding: 40px calc(var(--screen-pad) + 4px) 8px; }

/* Event history: 24-hour strip (orange = open) */
.ct-strip { padding: 4px 0 2px; }
.ct-strip .bar { position: relative; height: 12px; border-radius: 6px; background: var(--green-soft); overflow: hidden; }
.ct-strip .bar i { position: absolute; top: 0; bottom: 0; background: var(--orange); border-radius: 2px; }
.ct-strip .bar b { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--label-primary); border-radius: 1px; }
.ct-strip .axis { display: flex; justify-content: space-between; margin-top: 6px; font: var(--body-xs); color: var(--label-tertiary); }

/* Icon grid with names (Name & icon) */
.icon-grid.labeled button { aspect-ratio: auto; flex-direction: column; gap: 6px; padding: 12px 4px 10px; }
.icon-grid.labeled button span { font: var(--body-xs); color: var(--label-secondary); }
.icon-grid.labeled button[aria-pressed="true"] span { color: var(--primary); }

/* Simulated push notification */
.push { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 90; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 22px;
  background: rgba(38, 38, 42, .86); backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6); box-shadow: var(--shadow-pop);
  transform: translateY(-130%); transition: transform var(--dur-slow) var(--ease); cursor: pointer; }
.push.show { transform: translateY(0); }
.push-app { width: 36px; height: 36px; border-radius: 9px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.push-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.push-top { display: flex; justify-content: space-between; font: var(--body-xs); color: var(--label-secondary); letter-spacing: .3px; }
.push-txt > b { font: var(--body-md-accent); font-weight: 600; }
.push-body { font: var(--body-sm); color: var(--label-secondary); }
.push.danger .push-app { background: var(--red); }
.push.warn .push-app { background: var(--orange); }

/* ==========================================================================
   Light — Figma light sketches (6560:50289) in the current style (relay toggle, 15 px section labels,
   glass tracks, Position-style chips). Motion: transform / opacity only; the lamp glow follows "Fade time".
   ========================================================================== */
/* power toggle: exactly the relay's (no glow — the user's call, 2026-11-10) */

/* brightness: a 50 px pill; white fill grows from the left (scaleX, clipped by the round track) */
.lt-bar { position: relative; height: 50px; border-radius: 25px; overflow: hidden; background: var(--fill-tertiary); box-shadow: var(--glass-highlight); cursor: pointer; touch-action: none; outline: none; }
/* The suns never blend: a dark pair sits on the track and a light pair inside the white fill, so each sun switches
   colour exactly at the fill's edge. The fill is a plain overflow-hidden box whose width follows the value (its
   inner layer is as wide as the bar, so the suns inside never move). Why not clip-path / scaleX: WebKit left the
   fill's children unclipped at rest and clipped while dragging, and the exported mix-blend-mode: difference
   re-resolved when the fill changed GPU layers — both made the icons flicker ("o'ynayapti"). */
.lt-bar { container-type: inline-size; }
.lt-bar .lt-fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--v, .5) * 100%); overflow: hidden; background: #fff; contain: paint;
  transition: width 160ms var(--ease-out), opacity var(--dur) var(--ease-out); }
.lt-bar .lt-in { position: absolute; left: 0; top: 0; bottom: 0; width: 100cqw; }
.lt-bar.is-off .lt-fill { opacity: 0; }
.lt-bar .icon { position: absolute; top: 13px; width: 24px; height: 24px; pointer-events: none; }
.lt-bar .icon g { mix-blend-mode: normal !important; }
.lt-bar .lt-lo { left: 13px; } .lt-bar .lt-hi { right: 13px; }
.lt-bar > .icon { filter: brightness(0); }        /* on the track: dark, as before */
.lt-bar .lt-fill .icon { filter: invert(1); }      /* on the white fill: light grey, as before */
.lt-bar.is-off > .icon { filter: invert(1); opacity: .5; }

/* white tone: warm → cold track (the bulb's own range), white knob with two grip bars */
.lt-ct { position: relative; height: 50px; border-radius: 25px; background: linear-gradient(90deg, var(--from), var(--mid), var(--to)); cursor: pointer; touch-action: none; outline: none; transition: opacity var(--dur) var(--ease-out); }
.lt-knob { position: absolute; top: 3px; left: calc(3px + var(--v, .5) * (100% - 50px)); width: 44px; height: 44px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); transition: left 160ms var(--ease-out); }
.lt-knob::before, .lt-knob::after { content: ''; position: absolute; top: 14px; width: 2px; height: 16px; border-radius: 1px; background: rgba(0, 0, 0, .2); }
.lt-knob::before { left: 18px; } .lt-knob::after { left: 24px; }
.lt-ct.is-colour { opacity: .45; }

/* Colour — Figma 6560:49941: a 44 px column (white dot, a separator, four colour dots; the chosen one gets a white
   ring inside it) and the colour picture (radius 24, hairline border, a soft blurred copy behind it as a halo).
   The halo is a static blur — it never animates, so Safari keeps it steady. */
.lt-colour { display: flex; gap: 12px; align-items: stretch; }
.lt-colour.is-disabled { opacity: .35; pointer-events: none; }
.lt-dots { flex: none; width: 44px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 4px 0; }
.lt-dots button { position: relative; width: 30px; height: 30px; border-radius: 100px; box-shadow: inset 1px 1px 2px rgba(255, 255, 255, .24); transition: transform var(--dur-micro) var(--ease-out); }
.lt-dots button:active { transform: scale(.92); }
.lt-dots button[aria-pressed="true"]::after { content: ''; position: absolute; left: 4px; top: 4px; width: 22px; height: 22px; box-sizing: border-box; border: 2px solid #fff; border-radius: 100px; }
.lt-sep { width: 24px; height: 1px; border-radius: 56px; background: var(--separator-opaque); }
.lt-field { position: relative; flex: 1; aspect-ratio: 287 / 202.33;   /* Figma 6560:49952: 287 × 202 — the dot column stretches to it, so the gaps are 8.67 px */
  cursor: crosshair; touch-action: none; outline: none; }
.lt-glow, .lt-pic { position: absolute; inset: 0; border-radius: 24px; background-position: 50% 52%; background-size: 105.8% 106.3%; background-repeat: no-repeat; }
.lt-glow { filter: blur(10px); opacity: .5; }
.lt-pic { box-shadow: inset 0 0 0 1px var(--separator-opaque); }
.lt-ring { position: absolute; left: calc(var(--x, .5) * 100%); top: calc(var(--y, .5) * 100%); width: 36px; height: 36px; margin: -18px 0 0 -18px; box-sizing: border-box; border-radius: 100px;
  border: 3px solid #fff; box-shadow: 0 0 3px rgba(0, 0, 0, .1); transition: opacity var(--dur) var(--ease-out), left 120ms var(--ease-out), top 120ms var(--ease-out); }
.lt-ring.hidden { opacity: 0; }
.dragging .lt-fill, .dragging .lt-knob, .dragging .lt-ring { transition: none; }   /* 1:1 with the finger */
.lt-bar:focus-visible, .lt-ct:focus-visible, .lt-field:focus-visible { box-shadow: 0 0 0 3px var(--primary); }
[data-lt][aria-disabled="true"] { opacity: .35; pointer-events: none; }
.lt-reset { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; color: var(--label-secondary); }
.lt-reset:disabled { opacity: .35; }
.v2-head.muted .lt-reset .icon { width: 24px; height: 24px; }

/* effects: Position-style chips, three per row */
.lt-chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lt-chips .cw-chip { width: 100%; justify-content: center; }
@media (prefers-reduced-motion: reduce) {
  .lt-bar .lt-fill, .lt-knob, .lt-ring { transition: none; }
}

/* Timer — Custom (UI.timerSheet, relay + light): iOS-style hours / minutes wheel. Rows are 40 px, the centre band marks
   the value, rows fade out towards the edges (mask), scroll-snap settles on a row. */
.preset-grid button .icon { color: var(--label-primary); }
.tw { position: relative; display: flex; justify-content: center; gap: 24px; height: 200px; }
.tw::before { content: ''; position: absolute; left: 0; right: 0; top: 80px; height: 40px; border-radius: 10px; background: var(--fill-tertiary); pointer-events: none; }
.tw-col { position: relative; display: flex; align-items: center; gap: 6px; }
.tw-wheel { width: 56px; height: 200px; overflow-y: auto; scroll-snap-type: y mandatory; padding: 80px 0; box-sizing: border-box; scrollbar-width: none; outline: none; overscroll-behavior: contain;
  -webkit-mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); }
.tw-wheel::-webkit-scrollbar { display: none; }
.tw-wheel { cursor: grab; user-select: none; -webkit-user-select: none; }
.tw-wheel.drag { scroll-snap-type: none; cursor: grabbing; }   /* mouse drag: follow 1:1, settle on release */
.tw-wheel span { display: block; height: 40px; line-height: 40px; text-align: right; padding-right: 4px; scroll-snap-align: center; font: 400 22px/40px var(--font); font-variant-numeric: tabular-nums; color: var(--label-secondary); transition: color var(--dur-fast) var(--ease-out); }
.tw-wheel span.on { color: var(--label-primary); font-weight: 500; }
.tw-wheel:focus-visible { box-shadow: inset 0 0 0 2px var(--primary); border-radius: 10px; }
.tw-unit { font: var(--body-lg); color: var(--label-primary); min-width: 44px; }
.tw-end { margin: 12px 0 0; text-align: center; font: var(--body-sm); color: var(--label-secondary); }
.tw-btns { display: flex; gap: 10px; } .tw-btns .btn { flex: 1; }
.btn-primary:disabled { opacity: .4; }

/* Big power switch block — Figma 6560:49770: 44 px above the switch (from the 54 px toolbar frame; ours is 107 px
   tall vs Figma's 113, so 50 px here puts the switch at the same y = 157), 44 px below it to the next section.
   The status line under the switch sits inside those 44 px, so it never pushes the page when it appears. */
.power-area { position: relative; display: flex; flex-direction: column; align-items: center; padding: 50px 0 44px; }
.power-area .power-sub { position: absolute; left: var(--screen-pad); right: var(--screen-pad); top: calc(100% - 30px); min-height: 16px; text-align: center; }
.power-area + .v2-head.muted { padding-top: 0; }
.power-area + .list { margin-top: 0 !important; }

/* Temperature & humidity sensor — the two reported values are the page; the switch block's spacing (50 px from the
   toolbar) so every device page starts at the same height. Numbers roll (data-num). */
.th-hero { display: flex; justify-content: center; align-items: stretch; gap: 28px; padding: 50px var(--screen-pad) 0; transition: opacity var(--dur) var(--ease-out); }
.th-hero.is-off { opacity: .45; }
.th-val { text-align: center; min-width: 0; }
.th-num { display: flex; justify-content: center; align-items: flex-start; font: 600 56px/60px var(--font); letter-spacing: -1.5px; font-variant-numeric: tabular-nums; color: var(--label-primary); }
.th-num small { font: 600 22px/30px var(--font); letter-spacing: 0; color: var(--label-secondary); margin: 4px 0 0 3px; }
.th-cap { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; font: var(--body-md); letter-spacing: var(--body-md-ls); color: var(--label-secondary); }
.th-cap .icon { width: 18px; height: 18px; }
.th-sep { width: 1px; margin: 10px 0 28px; background: var(--separator-opaque); }
.th-rep { margin-top: 14px; text-align: center; font: var(--body-sm); color: var(--label-tertiary); }
/* history chart (server data) */
.th-chart { padding: 4px 0 2px; }
.th-plot { position: relative; height: 120px; }
.th-plot svg { display: block; width: 100%; height: 100%; overflow: visible; }
.th-dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 3px var(--bg-elevation-2); }
.th-axis { display: flex; justify-content: space-between; margin-top: 8px; font: var(--body-xs); color: var(--label-tertiary); font-variant-numeric: tabular-nums; }

/* Blocks in a sheet never touch: a group after a list, a chart or a switch (also when it opens inside a collapse)
   gets the same 24 px as group + group. Found by tools/checks/spacing.js. */
.sheet-body * + .sheet-group,
.sheet-body * + .collapse > .collapse-inner > .sheet-group:first-child { margin-top: 24px; }

</style>

<script>

/* ---- single-file router: #/page.html?query ---- */
(() => {
  const PAGES = ["index.html", "device.html", "device-settings.html", "about-device.html", "add-device.html"];
  // the route lives in the hash (#/device.html?id=…) and, as a backup, in window.name: hosts that run the
  // page in a sandboxed frame may drop a #/path hash on reload, window.name survives it
  const bag = () => { try { const o = JSON.parse(window.name || '{}'); if (o && o.samo) return o; } catch (e) {} return { samo: 1, local: {}, session: {} }; };
  const parse = () => {
    let h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    if (!/\.html/.test(h)) h = bag().route || '';
    const [file, search = ''] = h.split('?');
    const page = PAGES.includes(file) ? file : 'index.html';
    return { page, search: search ? '?' + search : '' };
  };
  window.__ROUTE = parse();
  window.__go = (url) => {
    const route = String(url).replace(/^\.?\//, ''), target = '#/' + route;
    const b = bag(); b.route = route; try { window.name = JSON.stringify(b); } catch (e) {}
    let hashed = false;
    try { if (location.hash !== target) { location.hash = target; hashed = location.hash === target; } } catch (e) {}
    if (!hashed) location.reload();   // hash set → the hashchange listener reloads
  };
  window.addEventListener('hashchange', () => location.reload());
  // relative links to other pages → routes (capture phase, before the app's handlers)
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a || a.target === '_blank') return;
    const href = a.getAttribute('href');
    const m = /^(?:\.\/)?([\w-]+\.html)(\?.*)?$/.exec(href || '');
    if (!m || !PAGES.includes(m[1])) return;
    e.preventDefault();
    window.__go(m[1] + (m[2] || ''));
  }, true);
})();

</script>

    sheetState = cfg;
    drawSheet();
    if (opening) { sheetEl.classList.add('entering'); setTimeout(() => sheetEl.classList.remove('entering'), 700); }
    requestAnimationFrame(() => { sheetEl.classList.add('open'); backdrop.classList.add('open'); });

    if (first && cfg.focus) setTimeout(() => first.focus(), 300);

    const c = sheetState; if (!c) return;

    const x = c.closeBtn === false ? '' : `<button class="icon-btn sheet-x" data-action="sheet-close" aria-label="Close">${icon('close-circle')}</button>`;
    sheetEl.classList.toggle('sheet-full', !!c.full);

    const sheetHTML = c.full
      ? `<div class="grabber"></div><div class="sheet-top">${x}</div>
        <div class="sheet-big-title">${esc(c.title)}</div>${c.sub ? `<div class="sheet-sub">${c.sub}</div>` : ''}
        <div class="sheet-body">${c.render ? c.render() : ''}</div>${footerHTML(c) ? `<div class="sheet-footer">${footerHTML(c)}</div>` : ''}`
      : `<div class="grabber"></div>
      <div class="sheet-head"><div class="sheet-title">${esc(c.title)}</div>${x}</div>
      ${c.sub ? `<div class="sheet-sub">${c.sub}</div>` : ''}
      ${c.tabs ? `<div class="sheet-tabs">${c.tabs()}</div>` : ''}
      <div class="sheet-body">${c.render ? c.render() : ''}</div>${footerHTML(c) ? `<div class="sheet-footer">${footerHTML(c)}</div>` : ''}`;

      motion stays smooth even while the blurred sheet is on screen. Width, colour and the name all
      share ONE duration and ONE curve, start on the same frame and land together. */
  const TAB_MS = 340, TAB_EASE = 'cubic-bezier(0.4, 0, 0.2, 1)';   // gentle start, soft landing: no jump, no crawl
  function placeTabs(prev) {
    const pick = sheetEl.querySelector('.ch-picker'); if (!pick) return;
    const btns = [...pick.querySelectorAll('button')];

    if (prev) pick.scrollLeft = prev.scroll;

  function closeSheet() {
    if (!sheetState) return;

    sheetEl.classList.remove('open'); backdrop.classList.remove('open');

  on({ 'sheet-close': closeSheet });

  /** Confirm sheet (Figma: Delete confirm modal) */

      title, closeBtn: false, sub: esc(text),

        <button class="btn btn-secondary" data-action="sheet-close">${esc(cancel)}</button>

    });
  }

  /** Text input sheet (Figma: Rename) */

    });

      title, focus: true,
      render: () => `<label class="field"><span class="field-label">${esc(label)}</span>
          <input id="promptInput" value="${esc(value)}" maxlength="40" autocomplete="off">
          <button class="field-clear" data-action="prompt-clear" aria-label="Clear">${icon('close-circle', 'icon icon-sm')}</button></label>
        <div class="field-error" id="promptErr"></div>`,
      footer: `<button class="btn btn-primary btn-block" data-action="prompt-ok">${esc(okText)}</button>`,
      onMount: (el) => {

  /* ---------- Popover ---------- */

    el.innerHTML = `<span class="push-app">${icon('tab-home', 'icon', 'style="width:20px;height:20px"')}</span>
      <span class="push-txt"><span class="push-top"><span>SAMO HOME</span><span>now</span></span><b>${esc(title)}</b>${body ? `<span class="push-body">${esc(body)}</span>` : ''}</span>`;

    `<button role="tab" aria-selected="${i === active}" aria-label="Channel ${i + 1}: ${esc(t)}" data-action="${action}" data-ch="${i}"><i class="pill" aria-hidden="true"></i><b>${i + 1}</b><span class="nm">${esc(t)}</span></button>`).join('')}</div>`;

      else if (e) s.refresh();

      'tm-custom': () => { st.custom = true; s.refresh(); place(); },
      'tm-back': () => { st.custom = false; s.refresh(); },
      'tm-go': () => { if (!secs()) return; cfg.saveCustom(secs()); start(secs()); },
      'tm-cancel': () => { cfg.cancel(); s.refresh(); toast('Timer cancelled'); },

  }

  document.addEventListener('click', (e) => { const n = e.target.closest && e.target.closest('.tw-wheel span'); if (n && !n.parentElement._dragged) n.parentElement.scrollTo({ top: +n.dataset.v * TW_ROW, behavior: 'smooth' }); });
  document.addEventListener('keydown', (e) => {
    const w = e.target.closest && e.target.closest('.tw-wheel'); if (!w || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;

})();

/* ===== js/devices/registry.js ===== */
/* Device type registry.
   Each device type implements the same interface so pages stay generic:

   Devices[type] = {
     label,                          // human name of the type
     icon(dev, ch)                   // icon name for tiles / settings avatar
     homeTiles(dev) -> [{ ch, name, icon, on, status, controllable, offline }]
     toggle(dev, ch)                 // quick power from the home tile
     page(dev, ctx) -> html          // device view (device.html)
     bindPage(dev, ctx)              // register UI.on() handlers for the page
     settings(dev, ctx) -> html      // type-specific sections on device-settings.html
     bindSettings(dev, ctx)
     about(dev) -> [[label, value, copyable]]   // extra rows on about-device.html
     tick(dev) -> boolean            // called every second, return true if state changed
     busy(dev) -> boolean            // something is in motion (home re-renders every second while true)
     protoPanel(dev, ctx) -> html    // desktop-only test panel (optional)
   }

   To add a new device type: create js/devices/<type>.js, assign Devices.<type> = {...},
   and include the script on each page before js/store.js. */
const Devices = {};

/* ---------- Generic: Hub ---------- */
Devices.hub = {
  label: 'Hub',
  icon: () => 'dev-hub',
  homeTiles: (d) => [{ ch: 0, name: d.name, icon: 'dev-hub', on: false, status: d.online ? 'Online' : 'Offline', controllable: false, offline: !d.online }],
  page: (d) => {
    const n = Store.state.devices.filter((x) => x.type !== 'hub').length;
    return `<div class="hero"><div class="hero-icon">${icon('dev-hub', 'icon', 'style="width:64px;height:64px"')}</div>
      <h1>${UI.esc(d.name)}</h1><p>${d.online ? 'Online' : 'Offline'} · ${n} connected devices</p></div>
      <div class="list-header">Connection</div>
      <div class="list"><div class="cell"><div class="cell-main"><div class="cell-title">${UI.esc(d.protocol)}</div><div class="cell-sub">Connection method</div></div></div></div>`;
  },
  about: (d) => [['Connection', d.protocol]],
};

/* ---------- Generic: Sensor (read-only) ---------- */
Devices.sensor = {
  label: 'Sensor',
  icon: () => 'dev-drop',
  homeTiles: (d) => [{ ch: 0, name: d.name, icon: 'dev-drop', on: false, status: d.online ? d.status : 'Offline', controllable: false, offline: !d.online }],
  page: (d) => `<div class="hero"><div class="hero-icon">${icon('dev-drop', 'icon', 'style="width:64px;height:64px"')}</div>
      <h1>${UI.esc(d.status)}</h1><p>Last update 2 min ago</p></div>
      <div class="pad"><div class="banner info">${icon('round-info')}<div><b>Coming soon</b> · This device type is not built yet. Relay is the first device interface.</div></div></div>`,
  about: () => [],
};

/* Fallbacks so pages can call any method safely */
const DeviceAPI = (d) => {
  const t = Devices[d.type] || Devices.sensor;
  return {
    label: t.label,
    icon: (ch) => (t.icon ? t.icon(d, ch) : 'info'),
    homeTiles: () => (t.homeTiles ? t.homeTiles(d) : []),
    toggle: (ch) => t.toggle && t.toggle(d, ch),
    page: (ctx) => (t.page ? t.page(d, ctx) : ''),
    bindPage: (ctx) => t.bindPage && t.bindPage(d, ctx),
    settings: (ctx) => (t.settings ? t.settings(d, ctx) : ''),
    bindSettings: (ctx) => t.bindSettings && t.bindSettings(d, ctx),
    about: () => (t.about ? t.about(d) : []),
    tick: () => (t.tick ? t.tick(d) : false),
    busy: () => (t.busy ? t.busy(d) : false),
    protoPanel: (ctx) => (t.protoPanel ? t.protoPanel(d, ctx) : ''),
    bindProto: (ctx) => t.bindProto && t.bindProto(d, ctx),
  };
};

/** Run every device's tick() once per second; save + callback if anything changed. */
function startDeviceClock(onChange) {
  UI.tick(() => {
    let changed = false;
    for (const d of Store.state.devices) if (DeviceAPI(d).tick()) changed = true;
    if (changed) Store.save();
    onChange && onChange(changed);
  });
}

   ========================================================================== */
Devices.relay = (() => {
  const esc = UI.esc;

  /* ---------- Feature catalogue ---------- */
  const F = {

    timer: { name: 'Timer', grp: 'Device page', ic: 'clock', type: 'control', perCh: true, short: 'Turns off once, after the time you pick.' },
    power: { name: 'Power & energy', grp: 'Device page', ic: 'bolt', type: 'reading', short: 'Electricity used.' },
    allOnOff: { name: 'All on / all off', grp: 'Device page', ic: 'double-check', type: 'control', short: 'All channels at once.' },
    events: { name: 'Button presses', grp: 'Device page', ic: 'hand-stop', type: 'event', short: 'Presses on the wall button.' },

    powerOn: { name: 'After a power cut', grp: 'Power cut', ic: 'bolt-crossed', type: 'choice', perCh: true, def: 'previous',
      opts: [['off', 'Stay off', 'Safer for heaters'], ['on', 'Turn on', ''], ['previous', 'Last state', 'Recommended'], ['toggle', 'Opposite', '']],

  };
  for (const k in F) F[k].short = F[k].short.replace(/\.$/, '');
  const SETTINGS_GROUPS = ['Power cut', 'Wall switch', 'Output', 'Lights on the device', 'Bulb', 'Safety'];

  const PRESETS = [

  const DISPLAY = [['light', 'Light', 'dev-bulb', 60, 'Lighting'], ['socket', 'Socket', 'dev-socket', 120, 'Sockets'], ['heater', 'Heater / boiler', 'dev-radiator', 1800, 'Heating'], ['fan', 'Fan', 'dev-fan', 40, 'Air'], ['pump', 'Water pump', 'dev-drop', 750, 'Water'], ['gate', 'Gate / door', 'dev-gate', 15, 'Gates & doors'], ['switch', 'Other device', 'dev-socket', 25, 'Appliances']];
  const PICK_DISPLAY = DISPLAY.filter((x) => x[0] !== 'pump');   // Figma "Display as" list (old pump channels still show)

  const ICON_SETS = {

  const CH_COUNTS = [1, 2, 3, 4, 6];

  /* ---------- Model helpers ---------- */
  const clone = (x) => (typeof x === 'object' ? JSON.parse(JSON.stringify(x)) : x);

  }
  function setChannelCount(d, n) {

  function create(presetId, { name, roomId, channelNames } = {}) {

      id: Store.uid('d'), type: 'relay', preset: p.id, name: name || p.name, roomId: roomId || null,

      serial: 'SN' + Math.random().toString().slice(2, 14) + 'LX', mac: Array.from({ length: 6 }, () => Math.floor(Math.random() * 256).toString(16).padStart(2, '0').toUpperCase()).join(':'),

  function setChannel(d, i, on) {
    if (!d.online) return 'Relay is offline';
    const c = d.channels[i];

MDc1IDI2LjA4NzUgOS44NzYwMSAyNi4zNjI1IDkuNjAwMDFDMjYuNjYyNSA5LjMgMjcuMDI1IDkuMTQ0IDI3LjQ1IDkuMTMyQzI3Ljg3NSA5LjEyIDI4LjIyNSA5LjI3NjAxIDI4LjUgOS42MDAwMUMyOS40NzUgMTAuOCAzMC4yMTkgMTIuMTEyNSAzMC43MzIgMTMuNTM3NUMzMS4yNDUgMTQuOTYyNSAzMS41MDEgMTYuNDUgMzEuNSAxOEMzMS41IDE5Ljg3NSAzMS4xNDQgMjEuNjMxNSAzMC40MzIgMjMuMjY5NUMyOS43MiAyNC45MDc1IDI4Ljc1NzUgMjYuMzMyNSAyNy41NDQ1IDI3LjU0NDVDMjYuMzMxNSAyOC43NTY1IDI0LjkwNjUgMjkuNzE5IDIzLjI2OTUgMzAuNDMyQzIxLjYzMjUgMzEuMTQ1IDE5Ljg3NiAzMS41MDEgMTggMzEuNUMxNi4xMjQgMzEuNDk5IDE0LjM2OCAzMS4xNDMgMTIuNzMyIDMwLjQzMloiIGZpbGw9IiNGRjQ1M0EiLz4KPC9nPgo8L3N2Zz4K" width="36" height="36" alt=""></span></button>
        <div class="t-sm c-secondary power-sub" data-num data-live="${grouped(d) ? 'group' : 'ch0'}">${grouped(d) ? groupLine(d) : subLine(d, 0)}</div></div>`;
    } else {
      const cols = d.channels.length === 3 || d.channels.length === 6 ? 'cols-3' : '';
      h += `<div class="pad" data-key="ch-grid" style="padding-top:32px"><div class="channel-grid ${cols}">${d.channels.map((c, i) => `
        <button class="tile ${d.online && c.on ? 'on' : ''} ${!d.online ? 'offline' : ''}" data-action="relay-toggle" data-ch="${i}">
          <span class="tile-icon" style="${d.online && c.on ? 'color:' + accent(c.display) : ''}">${icon(chIcon(c), 'icon', 'style="width:28px;height:28px"')}</span>
          <span class="tile-power">${icon('power', 'icon icon-sm')}</span>
          <span class="tile-name">${esc(c.name)}</span>
          <span class="tile-status" data-num data-live="ch${i}">${chStatus(d, i)}</span>
        </button>`).join('')}</div></div>`;
      // One plain-language action instead of "All on / All off": it says exactly what it will do
      if (has(d, 'allOnOff')) {
        const any = anyOn(d), what = 'devices';
        h += `<div class="pad" data-key="all" style="margin-top:16px"><button class="all-action ${any ? 'turn-off' : 'turn-on'}" data-action="relay-master" ${!d.online ? 'disabled' : ''}>
          ${icon('power', 'icon', 'style="width:20px;height:20px"')}<span>${any ? `Turn off all ${what}` : `Turn on all ${what}`}</span></button></div>`;
      }
    }

    // 2. Settings you can open (tappable rows with chevrons)
    const controls = [];
    if (has(d, 'timer')) {
      let running = d.channels.map((c, i) => (c.timer && c.timer.kind === 'timer' ? i : -1)).filter((i) => i >= 0);
      if (grouped(d)) running = running.slice(0, 1);
      controls.push(`<button class="cell has-icon" data-action="relay-timer"><span class="cell-icon">${icon('clock')}</span>
        <span class="cell-main cell-title">Timer</span><span class="cell-value" data-num data-live="timer">${running.length ? `Off in ${UI.fmtDur((d.channels[running[0]].timer.end - Date.now()) / 1000)}` : ''}</span>${icon('chevron-right', 'chev')}</button>`);
    }
    if (has(d, 'inching')) {
      const on = d.channels.some((_, i) => get(d, 'inching', i).on);
      controls.push(`<button class="cell has-icon" data-action="relay-feature" data-k="inching"><span class="cell-icon">${icon('refresh')}</span>
        <span class="cell-main cell-title">Auto-off</span><span class="cell-value">${on ? 'On' : 'Off'}</span>${icon('chevron-right', 'chev')}</button>`);
    }
    if (controls.length) h += `<div class="list" data-key="controls" style="margin-top:20px">${controls.join('')}</div>`;

    // 3. Information (flat, not tappable)
    if (has(d, 'power')) {
      const w = watts(d);
      h += `<div class="v2-head muted" data-key="pw-head"><span>Power & energy</span></div>
        <div class="pad info-grid" data-key="pw">
          <div class="info-card"><span>Power</span><b data-num="count" data-live="w">${Math.round(w)}W</b></div>
          <div class="info-card"><span>Voltage</span><b data-num="count">${d.online ? '230V' : '—'}</b></div>
          <div class="info-card"><span>Current</span><b data-num="count" data-live="amp">${(w / 229.6).toFixed(2)}A</b></div>
          <div class="info-card"><span>Energy (total)</span><b data-num="count" data-live="kwh">${d.energy.toFixed(2)}kWh</b></div>
          ${tempCard(d)}
        </div>`;
    } else if (has(d, 'deviceTemp')) h += `<div class="pad info-grid" data-key="tmp" style="margin-top:32px">${tempCard(d)}</div>`;
    if (has(d, 'events')) {
      const ev = d.events.slice(0, 4);
      h += `<div class="v2-head muted" data-key="ev-head"><span>Button presses</span></div><div class="pad" data-key="ev">${ev.length
        ? `<div class="flat-list">${ev.map((e) => `<div class="event-row"><span><b>${esc(e.action)}</b> press${split(d) ? ' · ' + esc(d.channels[e.ch]?.name || '') : ''}</span><span>${UI.fmtTime(e.t)}</span></div>`).join('')}</div>`
        : '<p class="t-md c-tertiary" style="padding:2px 4px">No presses yet</p>'}</div>`;
    }
    return h + '<div style="height:28px"></div>';
  }

  /** Figma "Device temperature": full-width card with the thermometer on the right (under Power & energy). */
  const tempCard = (d) => (has(d, 'deviceTemp') ? `<div class="info-card wide"><span>Device temperature</span><b data-num="count">${d.online ? d.temp + '°C' : '—'}</b>${icon('sensor-temperature')}</div>` : '');
  function groupLine(d) {
    const st = groupStatus(d);
    return `${d.channels.length} channels together${st === 'On' || st === 'Off' ? '' : ' · ' + st}`;
  }
  function subLine(d, i) {
    const c = d.channels[i];
    if (!d.online) return 'Offline';
    if (c.timer) return `${c.timer.kind === 'inch' ? 'Auto-off' : 'Timer'} · off in ${UI.fmtDur((c.timer.end - Date.now()) / 1000)}`;
    if (has(d, 'inching') && get(d, 'inching', i).on) return `Auto-off after ${get(d, 'inching', i).sec} s`;
    return '';   // Figma: nothing under the button — the power cards show the watts
  }
  /** Cheap per-second update of countdown texts without full re-render. */
  function live(d, root) {
    d.channels.forEach((_, i) => UI.setNum(root.querySelector(`[data-live="ch${i}"]`), split(d) ? chStatus(d, i) : subLine(d, i)));
    UI.setNum(root.querySelector('[data-live="group"]'), groupLine(d));
    UI.setNum(root.querySelector('[data-live="w"]'), Math.round(watts(d)) + 'W');
    UI.setNum(root.querySelector('[data-live="amp"]'), (watts(d) / 229.6).toFixed(2) + 'A');
    UI.setNum(root.querySelector('[data-live="kwh"]'), d.energy.toFixed(2) + 'kWh');
    const wt = root.querySelector('[data-live="wait"]'); if (wt && d.wait) UI.setNum(wt, Math.ceil((d.wait.until - Date.now()) / 1000));
    const t = root.querySelector('[data-live="timer"]');
    if (t) { const c = d.channels.find((x) => x.timer && x.timer.kind === 'timer'); UI.setNum(t, c ? `Off in ${UI.fmtDur((c.timer.end - Date.now()) / 1000)}` : ''); }
  }

  function bindPage(d, ctx) {
    const commit = (msg) => { Store.save(); ctx.render(); if (msg) UI.toast(msg); };
    UI.on({
      'relay-toggle': ({ ch }) => {
        const m = toggle(d, +ch); commit(m && m.includes('interlock') ? m : null);
        UI.pulse(UI.screen.querySelector(`[data-action="relay-toggle"][data-ch="${ch}"]`), 'just-toggled');
      },
      'relay-master': () => {
        const on = !anyOn(d);
        const what = 'devices';
        d.channels.forEach((_, i) => setChannel(d, i, on)); commit(on ? `All ${what} on` : `All ${what} off`);
        UI.pulse(UI.screen.querySelector('.all-action'), 'just-toggled');
        UI.screen.querySelectorAll('.channel-grid .tile').forEach((t, i) => setTimeout(() => UI.pulse(t, 'just-toggled'), 40 * i)); // ripple across channels
      },
      'relay-timer': () => openTimer(d, 0, ctx),
      'relay-feature': ({ k }) => openFeature(d, k, 0, ctx),
    });
  }

  /* ---------- Timer sheet: the shared one (UI.timerSheet — presets + Custom wheel) ---------- */
  function openTimer(d, ch, ctx) {
    let c = ch;
    UI.timerSheet({
      sub: esc(F.timer.short),
      tabs: split(d) ? () => UI.segTabs(d.channels.map((x) => x.name), c, 'tm-ch') : null,
      running: () => { const t = d.channels[c].timer; return t && t.kind === 'timer' ? t : null; },
      start: (sec) => { const m = startTimer(d, c, sec); Store.save(); ctx.render(); return m; },
      cancel: () => { (grouped(d) ? d.channels : [d.channels[c]]).forEach((x) => { x.timer = null; }); Store.save(); ctx.render(); },
      lastCustom: () => d.tmCustom, saveCustom: (sec) => { d.tmCustom = sec; },
      extra: (s) => ({ 'tm-ch': ({ ch: x }) => { c = +x; s.refresh(); } }),
    });
  }

  /* ---------- Feature setting sheet (any type) ---------- */
  function openFeature(d, k, ch, ctx) {
    const f = F[k]; let c = ch;
    const commit = () => {
      // grouped: per-channel settings are one setting → copy channel 1's value to every channel
      if (f.perCh && grouped(d)) d.settings[k] = d.channels.map(() => clone(d.settings[k][0]));
      Store.save(); ctx.render(); s.refresh();
    };
    const stepper = (act, val, unit, extra = '') => `<div class="stepper"><button data-action="${act}" data-d="-1" ${extra} aria-label="Less">−</button><output data-num>${val} ${unit}</output><button data-action="${act}" data-d="1" ${extra} aria-label="More">+</button></div>`;
    const s = UI.sheet({
      title: f.name, sub: esc(f.short),
      tabs: f.perCh && split(d) ? () => UI.segTabs(d.channels.map((x) => x.name), c, 'rf-ch') : null,
      render: () => {
        let h = '';
        const v = get(d, k, c);
        if (f.type === 'choice') {
          h += `<div class="list">${f.opts.map((o) => `<button class="option" role="radio" aria-checked="${v === o[0]}" data-action="rf-opt" data-v="${o[0]}">
            <span class="option-main"><span class="option-title" style="display:block">${esc(o[1])}</span>${o[2] ? `<span class="option-sub" style="display:block">${esc(o[2])}</span>` : ''}</span><span class="radio">${icon('radio-on')}</span></button>`).join('')}</div>`;
        } else if (f.type === 'toggle') {
          h += `<div class="list"><button class="cell" data-action="rf-toggle"><span class="cell-main cell-title">${esc(f.name)}</span><span class="switch" role="switch" aria-checked="${!!v}"></span></button></div>`;
        } else if (f.type === 'number') {
          h += `<div class="list"><div class="cell"><span class="cell-main cell-title">Delay</span>${stepper('rf-num', v, f.unit)}</div></div>`;
        } else if (f.type === 'inch') {
          h += `<div class="list"><button class="cell" data-action="rf-toggle"><span class="cell-main cell-title">Auto-off</span><span class="switch" role="switch" aria-checked="${v.on}"></span></button>
            ${UI.collapse(v.on, `<div class="cell"><span class="cell-main cell-title">Turn off after</span>${stepper('rf-num', v.sec, 's')}</div>`)}</div>`;
        } else if (f.type === 'backlight') {
          h += `<div class="list"><button class="cell" data-action="rf-toggle"><span class="cell-main cell-title">Backlight</span><span class="switch" role="switch" aria-checked="${v.on}"></span></button>
            ${UI.collapse(v.on, `<div class="cell slider-row"><div class="row"><span class="cell-title grow">Brightness</span><span class="slider-val" data-num id="brVal">${v.br}%</span></div><input type="range" class="range" min="0" max="100" value="${v.br}" style="--v:${v.br / 100}" id="brRange" aria-label="Brightness"></div>`)}</div>`;
        } else if (f.type === 'color') {
          h += ['on', 'off'].map((w) => UI.group(`When ${w}`, `<div class="swatches group-pad sw-card">${Object.keys(COLORS).map((n) => `<button class="swatch" style="background:${COLORS[n]}" aria-pressed="${v[w] === n}" aria-label="${n}" data-action="rf-color" data-w="${w}" data-n="${n}"></button>`).join('')}</div>`)).join('');
        } else if (f.type === 'protect') {
          const L = [['overV', 'Voltage too high', 'V', 200, 265, 1], ['underV', 'Voltage too low', 'V', 75, 240, 1], ['overI', 'Current too high', 'A', 1, 65, 1], ['overP', 'Power too high', 'W', 100, 25000, 100], ['temp', 'Too hot', '°C', 40, 100, 1]];
          h += UI.group('Limits', L.map(([x, l, u]) => `<div class="cell"><span class="cell-main cell-title">${l}</span>${stepper('rf-prot', v[x], u, `data-x="${x}"`)}</div>`).join(''))
            + UI.group('When a limit is passed', [['trip', 'Cut the power'], ['alarm', 'Only alert me'], ['ignore', 'Ignore']].map(([a, l]) => `<button class="option" role="radio" aria-checked="${v.act === a}" data-action="rf-prot-act" data-v="${a}"><span class="option-main option-title">${l}</span><span class="radio">${icon('radio-on')}</span></button>`).join(''))
            + UI.group('', `<button class="cell" data-action="rf-reclose"><span class="cell-main"><span class="cell-title" style="display:block">Auto-reclose</span><span class="cell-sub" style="display:block">Turn back on when values are normal</span></span><span class="switch" role="switch" aria-checked="${v.reclose}"></span></button>`);
        }
        return h;
      },
      footer: '<button class="btn btn-primary btn-block" data-action="sheet-close">Done</button>',
      onMount: (el) => {
        const r = el.querySelector('#brRange');
        if (r) r.oninput = () => { get(d, k, c).br = +r.value; UI.setNum(el.querySelector('#brVal'), r.value + '%'); Store.save(); };
        if (r) r.onchange = () => ctx.render();
      },
    });
    const L = { overV: [200, 265, 1], underV: [75, 240, 1], overI: [1, 65, 1], overP: [100, 25000, 100], temp: [40, 100, 1] };
    UI.on({
      'rf-ch': ({ ch: x }) => { c = +x; s.refresh(); },
      'rf-opt': ({ v }) => { set(d, k, c, v); commit(); },
      'rf-toggle': () => {
        if (k === 'interlock' && !get(d, k) && grouped(d)) { UI.toast('Ungroup channels first — interlock allows only one channel on'); return; }
        const v = get(d, k, c); if (typeof v === 'object') v.on = !v.on; else set(d, k, c, !v); commit(); },
      'rf-num': ({ d: dir }) => {
        const v = get(d, k, c);
        if (f.type === 'inch') { const st = v.sec < 10 ? 1 : v.sec < 60 ? 5 : 30; v.sec = Math.min(3600, Math.max(1, v.sec + st * dir)); }
        else set(d, k, c, Math.min(f.max, Math.max(f.min, +(v + f.step * dir).toFixed(1))));
        commit();
      },
      'rf-color': ({ w, n }) => { get(d, k, c)[w] = n; commit(); },
      'rf-prot': ({ x, d: dir }) => { const v = get(d, k, c); const [a, z, st] = L[x]; v[x] = Math.min(z, Math.max(a, v[x] + st * dir)); commit(); },
      'rf-prot-act': ({ v: a }) => { get(d, k, c).act = a; commit(); },
      'rf-reclose': () => { const v = get(d, k, c); v.reclose = !v.reclose; commit(); },
    });
  }

  /* ==========================================================================
     Settings page sections (device-settings.html)
     ========================================================================== */
  function settings(d) {
    let h = '';
    if (multi(d)) {
      const lock = interlockOn(d) && !grouped(d);
      h += `<div class="list-header">Channels</div><div class="list">
        <button class="cell" data-action="rs-group" ${lock ? 'aria-disabled="true"' : ''}><span class="cell-main"><span class="cell-title" style="display:block">Group channels</span>
          <span class="cell-sub" style="display:block">One button for all channels</span></span>
          <span class="switch" role="switch" aria-checked="${grouped(d)}" style="${lock ? 'opacity:.4' : ''}"></span></button></div>
        ${UI.collapse(lock, '<div class="list-footer">Turn off Interlock to group channels.</div>')}
        ${UI.collapse(split(d), `<div class="list" style="margin-top:12px">` + d.channels.map((c, i) => `
        <button class="cell has-icon ch-row" data-action="rs-channel" data-ch="${i}"><span class="cell-icon">${icon(chIcon(c))}</span>
          <span class="cell-main"><span class="cell-title" style="display:block">${esc(c.name)}</span><span class="cell-sub" style="display:block">Channel ${i + 1} · ${displayOf(c.display)[1]}</span></span>${icon('chevron-right', 'chev')}</button>`).join('') + '</div>')}`;
    }
    for (const [title, grps] of SETTINGS_CARDS) {
      const ks = grps.flatMap((g) => Object.keys(F).filter((k) => F[k].grp === g && has(d, k)));
      if (!ks.length) continue;
      h += `${title ? `<div class="list-header">${title}</div>` : '<div class="list-gap"></div>'}<div class="list">${ks.map((k) => {
        const f = F[k];
        if (f.type === 'toggle') {   // only an on/off switch → switch it right here, no sheet
          const on = !!get(d, k);
          return `<button class="cell" data-action="rs-toggle" data-k="${k}" role="switch" aria-checked="${on}">
            <span class="cell-main"><span class="cell-title" style="display:block">${esc(f.name)}</span>${f.showSub ? `<span class="cell-sub" style="display:block">${esc(f.short)}</span>` : ''}</span>
            <span class="switch" aria-hidden="true" aria-checked="${on}"></span></button>`;
        }
        const sm = summary(d, k);
        return `<button class="cell" data-action="rs-feature" data-k="${k}">
          <span class="cell-main"><span class="cell-title" style="display:block">${esc(f.name)}</span>${sm.sub ? `<span class="cell-sub" style="display:block">${esc(sm.sub)}</span>` : ''}</span>
          ${sm.value ? `<span class="cell-value">${esc(sm.value)}</span>` : ''}${icon('chevron-right', 'chev')}</button>`;
      }).join('')}</div>`;
    }
    return h;
  }
  function displayRow(d) {
    const row = `<button class="cell" data-action="rs-display" data-ch="0"><span class="cell-main cell-title">Display As</span><span class="cell-value">${displayOf(split(d) ? d.channels[0].display : groupTarget(d).display)[1]}</span>${icon('chevron-right', 'chev')}</button>`;
    return multi(d) ? UI.collapse(!split(d), row) : row;   // multi-channel: appears smoothly when channels get grouped
  }
  /* ---------- Channel Edit (Figma 5990:67634) ----------
     Full sheet: icon (pen → icon picker) · name · Display as (→ picker) · Save.
     Changes are kept in a draft and applied only on Save. */
